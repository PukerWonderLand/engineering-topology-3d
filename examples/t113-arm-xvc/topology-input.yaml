schemaVersion: "1.0"
system:
  id: t113-arm-xvc
  title: T113 ARM-XVC 远程 FPGA 调试架构
  source: sanitized-engineering-review
  mode: static-evidence-map

planes:
  - id: host
    label: x86 工程设备 / FPGA 工具链
    order: [工程师, Vivado-ProCISE, 本机hw_server与门禁, 可信LAN, x86网口]
  - id: fpga
    label: T113 ARMv7 / XVC 网关
    order: [T113以太网, Buildroot, multi-manager, XVC-A, XVC-B-candidate, native-health]
  - id: spu
    label: USB Hub / JTAG / FPGA 实板
    order: [T113-USB-Host, 独立供电USB-Hub, JTAG-A, JTAG-B, XCKU15P, XC7VX690T]

routes:
  - id: KU15P
    evidence: RUNTIME_OBSERVED
    protocol: XVC TCP 10200 -> openFPGALoader -> FTDI MPSSE -> JTAG TAP
    tool: Vivado 2019.1
    target: XCKU15P
    serialHistorical: "EXAMPLE_PROBE_A"
    idcodeMasked: "EXAMPLE_IDCODE"
  - id: X690T
    evidence: INFERRED
    protocol: ProCISE -> remote boundary -> T113 candidate -> JTAG
    tool: ProCISE
    target: XC7VX690T
    caveat: 当前资料只验证双 KU15P，未证明 ProCISE 原生远程 XVC
  - id: HEALTH
    evidence: CODE_PROVEN
    protocol: manager -> idle-only native IDCODE -> serial-bound instance recovery

journeys: [KU15P远程XVC, 690T架构边界, T113双实例启动, 单实例断线恢复, Flash与冷启动门禁]
causalLayers: [payload, control, sync, lifecycle]
evidenceLevels: [CODE_PROVEN, RUNTIME_OBSERVED, INFERRED]

notClaimed:
  - 690T远程XVC或ProCISE原生远程协议已验证
  - 冷启动3次门禁已完成
  - 第三或第四路JTAG已兼容
  - 双XVC加UART已验证
  - 24小时或7天稳定性
  - USB热插拔完全不影响其他实例
  - Buildroot整包SD或NAND已验证
  - XVC可直接暴露公网
