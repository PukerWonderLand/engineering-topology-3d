enhanced:
  defaultView: overview
  content:
    zhCN:
      planeMeta:
        host:
          label: x86 工程设备 / FPGA 工具链
          short: X86 / TOOLS
          color: "#2878c7"
        fpga:
          label: T113 ARMv7 / XVC 网关
          short: T113 / XVC
          color: "#7657c8"
        spu:
          label: USB Hub / JTAG / FPGA 实板
          short: PHYSICAL
          color: "#168f7b"
      edgeMeta:
        LAN:
          color: "#22b8cf"
          label: 可信局域网 / XVC TCP
        VIRTUAL:
          color: "#8a61d1"
          label: ARM 用户态 / 服务控制
        USB:
          color: "#f4a62a"
          label: USB / FTDI / MPSSE
        DEBUG:
          color: "#5f86df"
          label: JTAG TAP / FPGA / Flash
      laneMeta:
        KU15P:
          color: "#2f83e7"
          label: XVC · TCP 10200
          summary: Vivado 2019.1 → XCKU15P · 已验证
        X690T:
          color: "#8a61d1"
          label: 690T · 目标链路
          summary: ProCISE → XC7VX690T · 远程路径未验证
        HEALTH:
          color: "#13a681"
          label: 健康 / 恢复控制
          summary: manager → native IDCODE → 单实例恢复
      functionInteractions:
        host-client:
          - source: 0
            target: 1
            label: 调用工具链
            kind: CALL
            note: 工程人员在 x86 设备上选择 Vivado 或 ProCISE，而不是把桌面工具安装到 T113。
        host-pcs:
          - source: 0
            target: 1
            label: 本机 hw_server
            kind: CALL
            note: Vivado 通过本机 hw_server 连接 xilinx-xvc 网关。
          - source: 1
            target: 2
            label: 工具边界
            kind: CONTROL
            note: 690T/700T 仍归 ProCISE；远程 XVC 能力必须单独验证。
        fpga-c2s:
          - source: 0
            target: 1
            label: 创建实例
            kind: CALL
            note: manager 校验唯一配置后启动各自 supervisor。
          - source: 1
            target: 2
            label: 隔离运行态
            kind: CONTROL
            note: 每根 JTAG 独占 PID、锁、端口、日志和 runtime。
        fpga-s2c:
          - source: 0
            target: 1
            label: XVC shift
            kind: DATA
            note: openFPGALoader 把 TMS/TDI 向量转换为 FTDI MPSSE 操作并返回 TDO。
          - source: 1
            target: 2
            label: 单客户端
            kind: CONTROL
            note: 同一物理 JTAG 同时只允许一个活跃客户端。
        fpga-spu-ep:
          - source: 0
            target: 1
            label: 空闲检查
            kind: CALL
            note: 活跃会话期间跳过探测，避免 health 插入 TAP shift。
      driverCausalLayerMeta:
