          id: wait
          title: Single-Instance Disconnect and Recovery
          shortTitle: Recovery
          summary: A client or USB disconnect cleans up only its instance while the other JTAG remains available; recovery waits for serial rematching.
          caveat: The review proves both instances recover after Linux reboot; disturbance-free USB hot-plug and 24 h/7 d stability remain incomplete.
