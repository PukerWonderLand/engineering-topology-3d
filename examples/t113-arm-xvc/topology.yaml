journeys:
  - id: send
    title:
      zhCN: KU15P 远程 XVC 事务
      enUS: KU15P Remote XVC Transaction
    summary:
      zhCN: x86 Vivado 经可信 LAN、T113 XVC、USB Hub 和 Digilent 到达 XCKU15P。
      enUS: x86 Vivado reaches XCKU15P through the trusted LAN, T113 XVC, USB Hub and Digilent probe.
    caveat:
      zhCN: 这是当前资料中真正板级验证的主链；实时运行前仍要重新探测 IP、serial、IDCODE 与器件。
      enUS: This is the only board-level validated main path in the current material. Re-discover IP, serial, IDCODE and device before every live run.
    steps:
      - id: ku-vivado
        functionId: ku-vivado
        title:
          zhCN: Vivado 2019.1 / local hw_server
          enUS: Vivado 2019.1 / local hw_server
        evidence: RUNTIME_OBSERVED
      - id: ku-lan
        nodeId: host-root
        title:
          zhCN: 可信 LAN / VLAN / ACL
          enUS: Trusted LAN / VLAN / ACL
        evidence: CODE_PROVEN
      - id: ku-manager
        functionId: ku-manager
        title:
          zhCN: xvc-gateway-multi-manager
          enUS: xvc-gateway-multi-manager
        evidence: CODE_PROVEN
      - id: ku-xvc
        functionId: ku-xvc
        title:
          zhCN: openFPGALoader XVC · TCP 10200
          enUS: openFPGALoader XVC · TCP 10200
        evidence: RUNTIME_OBSERVED
      - id: ku-hub
        nodeId: spu-spug
        title:
          zhCN: T113 USB Host → powered hub
          enUS: T113 USB Host → powered hub
        evidence: RUNTIME_OBSERVED
      - id: ku-cable
        nodeId: spu-spug
        title:
          zhCN: Digilent HS2 · probe A
          enUS: Digilent HS2 · probe A
        evidence: RUNTIME_OBSERVED
      - id: ku-fpga
        nodeId: spu-spug
        title:
          zhCN: XCKU15P · IDCODE 0x04a56093
          enUS: XCKU15P · IDCODE 0x04a56093
        evidence: RUNTIME_OBSERVED
    edgeIds: []
  - id: receive
    title:
      zhCN: 690T / ProCISE 架构边界
      enUS: 690T / ProCISE Architecture Boundary
    summary:
      zhCN: 保留 x86 ProCISE、T113、USB Hub、第二下载器和 XC7VX690T 的目标物理链路。
      enUS: Retains the target physical path across x86 ProCISE, T113, USB Hub, a second probe and XC7VX690T.
    caveat:
      zhCN: 当前复盘基线验证的是双 KU15P，不是 690T；ProCISE 原生远程 XVC 未被证明，所以整条 690T 远程链使用推断证据。
      enUS: The review baseline validates dual KU15P, not 690T. Native ProCISE remote XVC is unproven, so the entire 690T remote path is marked inferred.
    steps:
      - id: x-procise
        functionId: x-procise
        title:
          zhCN: ProCISE · 690T 正式工具
          enUS: ProCISE · official 690T tool
        evidence: CODE_PROVEN
      - id: x-lan
        nodeId: host-root
        title:
          zhCN: 候选远程通道
          enUS: Candidate remote channel
        evidence: INFERRED
      - id: x-manager
        nodeId: fpga-host-sp37
        title:
          zhCN: 第二实例配置 / 独立故障域
          enUS: Second-instance configuration / isolated fault domain
        evidence: CODE_PROVEN
      - id: x-service
        functionId: x-service
        title:
          zhCN: XVC/JTAG B · TCP 10201
          enUS: XVC/JTAG B · TCP 10201
        evidence: INFERRED
      - id: x-hub
        nodeId: spu-spug
        title:
          zhCN: 独立供电 USB 扩展坞
          enUS: Powered USB Hub
        evidence: INFERRED
      - id: x-cable
        nodeId: spu-spug
        title:
          zhCN: 第二只 JTAG 下载器
          enUS: Second JTAG probe
        evidence: INFERRED
      - id: x-fpga
        nodeId: spu-spug
        title:
          zhCN: XC7VX690T · 待实机门禁
          enUS: XC7VX690T · pending hardware gates
        evidence: INFERRED
    edgeIds: []
  - id: init
    title:
      zhCN: T113 双实例启动
      enUS: T113 Dual-Instance Startup
    summary:
      zhCN: Buildroot SysV 启动 manager，校验唯一身份后建立两个独立 supervisor 和 health。
      enUS: Buildroot SysV starts the manager, validates unique identities and creates two independent supervisors and health loops.
    caveat:
      zhCN: 示例网关地址仅用于建模，部署时必须重新发现；Buildroot 整包 SD/NAND 尚未交付。
      enUS: The example gateway address is modeling-only and must be rediscovered for deployment; a complete Buildroot SD/NAND image has not been delivered.
    steps:
      - id: init-boot
        nodeId: host-root
        title:
          zhCN: T113 Linux 5.4.61 / Buildroot boot
          enUS: T113 Linux 5.4.61 / Buildroot boot
        evidence: RUNTIME_OBSERVED
      - id: init-sysv
        nodeId: fpga-host-sp37
        title:
          zhCN: S95xvc-gateway
          enUS: S95xvc-gateway
        evidence: CODE_PROVEN
      - id: init-validate
        functionId: init-validate
        title:
          zhCN: manager validate unique identities
          enUS: manager validate unique identities
        evidence: CODE_PROVEN
      - id: init-a
        nodeId: fpga-spu-ep
        title:
          zhCN: supervisor A / TCP 10200
          enUS: supervisor A / TCP 10200
        evidence: RUNTIME_OBSERVED
      - id: init-b
        nodeId: fpga-spu-ep
        title:
          zhCN: supervisor B / TCP 10201
          enUS: supervisor B / TCP 10201
        evidence: RUNTIME_OBSERVED
      - id: init-health
        functionId: init-health
        title:
          zhCN: native IDCODE health
          enUS: native IDCODE health
        evidence: CODE_PROVEN
      - id: init-ready
        nodeId: spu-spug
        title:
          zhCN: 双 KU15P 服务恢复
          enUS: Dual-KU15P service recovery
        evidence: RUNTIME_OBSERVED
    edgeIds: []
  - id: wait
    title:
      zhCN: 单实例断线与恢复
      enUS: Single-Instance Disconnect and Recovery
    summary:
      zhCN: 客户端或 USB 断开只清理对应实例，另一根 JTAG 保持服务，serial 重匹配后再恢复。
      enUS: A client or USB disconnect cleans up only its instance while the other JTAG remains available; recovery waits for serial rematching.
    caveat:
      zhCN: 复盘证明 Linux reboot 后双实例恢复；USB 热插拔完全无扰和 24 h/7 d 稳定仍未完成。
      enUS: The review proves both instances recover after Linux reboot; disturbance-free USB hot-plug and 24 h/7 d stability remain incomplete.
    steps:
      - id: wait-disconnect
        nodeId: spu-spug
        title:
          zhCN: client/USB 断开
          enUS: client/USB disconnect
        evidence: RUNTIME_OBSERVED
      - id: wait-supervisor
        functionId: wait-supervisor
        title:
          zhCN: supervisor observes exit
          enUS: supervisor observes exit
        evidence: CODE_PROVEN
      - id: wait-tap
        nodeId: fpga-spu-ep
        title:
          zhCN: reset session / TAP lifecycle
          enUS: reset session / TAP lifecycle
        evidence: CODE_PROVEN
      - id: wait-other
        nodeId: fpga-host-sp37
        title:
          zhCN: other JTAG remains online
          enUS: other JTAG remains online
        evidence: RUNTIME_OBSERVED
      - id: wait-rematch
        functionId: wait-rematch
        title:
          zhCN: serial identity rematch
          enUS: serial identity rematch
        evidence: CODE_PROVEN
      - id: wait-recover
        nodeId: fpga-spu-ep
        title:
          zhCN: restart affected instance
          enUS: restart affected instance
        evidence: RUNTIME_OBSERVED
    edgeIds: []
  - id: remove
    title:
      zhCN: Flash Program / Verify / 冷启动
      enUS: Flash Program / Verify / Cold Boot
    summary:
      zhCN: 先备份和双端哈希，再匹配 JEDEC/MCS，完成 Program、readback Verify 与冷启动分账。
      enUS: Back up and hash at both ends, then match JEDEC/MCS and perform Program, readback Verify and separate cold-boot accounting.
    caveat:
      zhCN: MT25QU512 Program/Verify 已通过；冷自动启动和命令启动目前都只有 PASS 1/3，不能称为稳定通过。
      enUS: MT25QU512 Program/Verify passed; automatic and command-triggered cold boot are each only PASS 1/3 and cannot be called stable.
    steps:
      - id: flash-authorize
        nodeId: host-pcs
        title:
          zhCN: 明确授权 + 锁定唯一 serial
          enUS: Explicit authorization + locked unique serial
        evidence: CODE_PROVEN
      - id: flash-stop
        nodeId: fpga-spu-ep
        title:
          zhCN: 停止目标实例 / 保持另一实例
          enUS: Stop target instance / preserve the other instance
        evidence: CODE_PROVEN
      - id: flash-backup
        nodeId: fpga-spu-ep
        title:
          zhCN: 完整读取 64 MiB Flash + 双端 SHA-256
          enUS: Read the full 64 MiB Flash + verify SHA-256 at both ends
        evidence: RUNTIME_OBSERVED
      - id: flash-match
        nodeId: spu-spug
        title:
          zhCN: MT25QU512 JEDEC / MCS / 地址门禁
          enUS: MT25QU512 JEDEC / MCS / address gates
        evidence: RUNTIME_OBSERVED
      - id: flash-program
        nodeId: spu-spug
        title:
          zhCN: Erase / Program 100%
          enUS: Erase / Program 100%
        evidence: RUNTIME_OBSERVED
      - id: flash-verify
        nodeId: spu-spug
        title:
          zhCN: readback Verify 100%
          enUS: readback Verify 100%
        evidence: RUNTIME_OBSERVED
      - id: flash-cold
        nodeId: host-pcs
        title:
          zhCN: 冷启动自动 / 命令恢复分账
          enUS: Separate automatic cold boot from command-triggered recovery
        evidence: RUNTIME_OBSERVED
    edgeIds: []
