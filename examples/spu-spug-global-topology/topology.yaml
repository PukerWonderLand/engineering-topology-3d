      driverJourneys:
        address-translation-walkthrough:
          id: address-translation-walkthrough
          title: 地址映射走查（TLP 代理链路）
          shortTitle: 地址映射走查（TLP 代理链路）
          summary: SPUG-FPGA 发描述符 → SPU-FPGA 取回原始地址并覆盖 TLP 头 → 命中 SUEP BAR4 → 还原物理地址。
          caveat: 这是一次现场取证记录，不是结构定义；图中没有 SPUG-FPGA 到 SPU-FPGA 的连接线，链路由区域 E 的六个说明框串起。
          steps:
            - id: step-descriptor
              title: SPUG-FPGA 发描述符
              detail: 描述符写在 SDEP BAR1 + 0x1000~0x1700，携带原始地址、长度、类型与 Tag。
              moduleNodeId: spug-fpga-nvme
              moduleRole: spug-fpga-nvme
              layers:
                - payload
            - id: step-overwrite
              title: 覆盖代理 TLP 头
              detail: 取回原地址 = 0x3c000400000，写入 s_spu_rq_tdata(63 downto 0)。
              moduleNodeId: spu-fpga-addr-trans
              moduleRole: spu-fpga-addr-trans
              layers:
                - control
            - id: step-hit-bar4
              title: RQ 命中 SUEP BAR4
              detail: RQ 送到 SPU 侧 PCIe 接口，落在 SUEP BAR4 的 128GiB 虚拟 BAR 地址池。
              moduleNodeId: bar-suep-pool
              moduleRole: bar-suep-pool
              layers:
                - payload
            - id: step-restore
              title: 还原物理地址
              detail: "0x34000000000 + (0x3c000400000 − 0x3c000000000) = 0x34000400000，与实机 Region 4: 128G @ 0x3c000000000 对得上。"
              moduleNodeId: spu-ep-direct
              moduleRole: spu-ep-direct
              layers:
                - payload
          edges:
            - source: step-descriptor
              target: step-overwrite
              layer: control
              relation: CALL
            - source: step-overwrite
              target: step-hit-bar4
              layer: payload
              relation: PAYLOAD
            - source: step-hit-bar4
              target: step-restore
              layer: payload
              relation: STATE
