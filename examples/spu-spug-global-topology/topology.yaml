      enUS: SPUG-FPGA sends descriptors to SPU-FPGA
    description:
      zhCN: SPUG-FPGA 发两类 TLP：描述符在 SDEP BAR1 + 0x1000~0x1700（携带原始地址/长度/类型/Tag），真实请求与数据在 SDEP BAR1 + 0x80000~0xf0000。
      enUS: "SPUG-FPGA emits two TLP classes: descriptors at SDEP BAR1 + 0x1000..0x1700 (carrying original address, length, type and tag), and real requests/data at SDEP BAR1 + 0x80000..0xf0000."
    kind: payload
    evidence: CODE_PROVEN
    color: "#4d8edb"
    lane: DATA
    protocol: PCIe
    dashed: false
  - id: addr-trans-to-suep-bar
    source: spu-fpga-addr-trans
    target: bar-suep-pool
    title:
      zhCN: 覆盖 TLP 头后命中 SUEP BAR4
      enUS: Overwritten TLP header hits SUEP BAR4
    description:
      zhCN: RQ 送到 SPU 侧 PCIe 接口后命中 SUEP BAR4，按「物理地址 = 物理A10 BAR1 + (虚拟地址 − 虚拟A10 BAR1)」还原。
      enUS: The RQ reaches the SPU-side PCIe interface and hits SUEP BAR4, restored as physical = physical-A10-BAR1 + (virtual - virtual-A10-BAR1).
    kind: payload
    evidence: CODE_PROVEN
    color: "#4d8edb"
    lane: DATA
    protocol: PCIe
    dashed: false
  - id: suep-bar-to-ep
    source: bar-suep-pool
    target: spu-ep-direct
    title:
      zhCN: SUEP Bar2 128GiB 窗口到 EP 端口
      enUS: SUEP Bar2 128GiB window to the EP port
    description:
      zhCN: 大型 64 位虚拟 BAR 地址池把下游设备地址空间搬进 SPU 内部。
      enUS: The large 64-bit virtual BAR pool moves downstream device address space inside SPU.
    kind: payload
    evidence: CODE_PROVEN
    color: "#4d8edb"
    lane: DATA
    protocol: PCIe
    dashed: false
  - id: ep-to-root-port
    source: spu-ep-direct
    target: spu-root-port
    title:
      zhCN: EP 端口接到内部根端口
      enUS: EP port attaches to the internal root port
    description:
      zhCN: SPU 内部 PCIe 树的入口。
      enUS: The entry point of the SPU-internal PCIe tree.
    kind: physical
    evidence: CODE_PROVEN
    color: "#607d8b"
    lane: PHYSICAL
    protocol: PCIe
    dashed: false
  - id: root-port-to-vbus
    source: spu-root-port
    target: spu-vbus-f0
    title:
      zhCN: 根端口下的虚拟总线 f0
      enUS: Virtual bus f0 beneath the root port
    description:
      zhCN: spu_vgpu 在 SPU 内部造出这条总线并挂上虚拟设备。
      enUS: spu_vgpu creates this bus inside SPU and attaches the virtual devices.
    kind: physical
    evidence: CODE_PROVEN
    color: "#607d8b"
    lane: PHYSICAL
    protocol: PCIe
    dashed: false
  - id: vbus-to-virtual-a10
    source: spu-vbus-f0
    target: spu-vgpu-a10
    title:
      zhCN: 枚举出 f0:00.0 虚拟 A10
      enUS: Enumerates f0:00.0 virtual A10
    description:
      zhCN: 保留 10de:2236。
      enUS: Retains 10de:2236.
    kind: physical
    evidence: CODE_PROVEN
    color: "#607d8b"
    lane: PHYSICAL
    protocol: PCIe
    dashed: false
  - id: vbus-to-virtual-nvme
    source: spu-vbus-f0
    target: spu-vgpu-nvme
    title:
      zhCN: 枚举出 f0:01.0 虚拟 NVMe
      enUS: Enumerates f0:01.0 virtual NVMe
    description:
      zhCN: 保留 144d:a808。
      enUS: Retains 144d:a808.
    kind: physical
    evidence: CODE_PROVEN
    color: "#607d8b"
    lane: PHYSICAL
    protocol: PCIe
    dashed: false
  - id: spu-sw-drives-vgpu
    source: spu-vgpu
    target: spu-vbus-f0
    title:
      zhCN: spu_vgpu 建立虚拟总线
      enUS: spu_vgpu establishes the virtual bus
    description:
      zhCN: 驱动加载后用虚拟总线把下游设备暴露给 SPU。
      enUS: After loading, the driver exposes downstream devices to SPU through the virtual bus.
    kind: control
    evidence: CODE_PROVEN
    color: "#d59a2b"
    lane: CONTROL
    protocol: PCIe
    dashed: false
  - id: sdep-to-host-addr
    source: bar-sdep-pool
    target: host-addr-space
    title:
      zhCN: SDEP Bar2 32GiB 到 Host 地址空间
      enUS: SDEP Bar2 32GiB to the host address space
    description:
      zhCN: Host 侧 DMA 重定向窗口，sdep_driver 能看到 A10 / NVMe / 两块 SPUG 的静态 BDF 与 BAR。
      enUS: The host-side DMA redirection window; sdep_driver can see the static BDF and BAR of the A10, NVMe and both SPUGs.
    kind: payload
    evidence: CODE_PROVEN
    color: "#4d8edb"
    lane: DATA
    protocol: PCIe
    dashed: false
  - id: sp37-pair
    source: spu-sp37
    target: sp37-downstream
    title:
      zhCN: 双侧 sp37 通过 Function 0 通信
      enUS: Both sp37 sides communicate over function 0
    description:
      zhCN: Buffer 默认 1 MiB，只负责可靠搬运字节和硬件控制。
      enUS: 1 MiB default buffer; only responsible for reliable byte transport and hardware control.
    kind: control
    evidence: CODE_PROVEN
    color: "#d59a2b"
    lane: CONTROL
    protocol: PCIe
    dashed: false
  - id: host-kernel-to-sdep
    source: host-kernel
    target: sdep-downstream
    title:
      zhCN: sdep.ko 绑定 SDEP Function
      enUS: sdep.ko binds the SDEP function
    description:
      zhCN: sdep.ko 绑定 5709:1001，扫 SPUG/GPU 拓扑并管理 NTB 与 P2P。
      enUS: sdep.ko binds 5709:1001, scans the SPUG/GPU topology and manages NTB and P2P.
    kind: control
    evidence: CODE_PROVEN
    color: "#d59a2b"
    lane: CONTROL
    protocol: PCIe
    dashed: false
journeys:
  - id: address-translation-walkthrough
    title:
      zhCN: 地址映射走查（TLP 代理链路）
      enUS: Address Translation Walkthrough (TLP Proxy)
    summary:
      zhCN: SPUG-FPGA 发描述符 → SPU-FPGA 取回原始地址并覆盖 TLP 头 → 命中 SUEP BAR4 → 还原物理地址。
      enUS: SPUG-FPGA sends descriptors -> SPU-FPGA restores the original address and overwrites the TLP header -> hits SUEP BAR4 -> restores the physical address.
    caveat:
      zhCN: 这是一次现场取证记录，不是结构定义；图中没有 SPUG-FPGA 到 SPU-FPGA 的连接线，链路由区域 E 的六个说明框串起。
      enUS: This is a field observation, not a structural definition; the diagram draws no connector from SPUG-FPGA to SPU-FPGA. The chain is stitched from the six region-E callouts.
    steps:
      - id: step-descriptor
        title:
          zhCN: SPUG-FPGA 发描述符
          enUS: SPUG-FPGA emits descriptors
        nodeId: spug-fpga-nvme
        evidence: RUNTIME_OBSERVED
      - id: step-overwrite
        title:
          zhCN: 覆盖代理 TLP 头
          enUS: Overwrite the proxied TLP header
        nodeId: spu-fpga-addr-trans
        evidence: RUNTIME_OBSERVED
      - id: step-hit-bar4
        title:
          zhCN: RQ 命中 SUEP BAR4
          enUS: The RQ hits SUEP BAR4
        nodeId: bar-suep-pool
        evidence: RUNTIME_OBSERVED
      - id: step-restore
        title:
          zhCN: 还原物理地址
          enUS: Restore the physical address
        nodeId: spu-ep-direct
        evidence: RUNTIME_OBSERVED
    edgeIds:
      - spug-fpga-to-spu-fpga-proxy
      - addr-trans-to-suep-bar
      - suep-bar-to-ep
