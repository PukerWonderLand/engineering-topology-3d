      driverJourneys:
        address-translation-walkthrough:
          id: address-translation-walkthrough
          title: Address Translation Walkthrough (TLP Proxy)
          shortTitle: Address Translation Walkthrough (TLP Proxy)
          summary: SPUG-FPGA sends descriptors -> SPU-FPGA restores the original address and overwrites the TLP header -> hits SUEP BAR4 -> restores the physical address.
          caveat: This is a field observation, not a structural definition; the diagram draws no connector from SPUG-FPGA to SPU-FPGA. The chain is stitched from the six region-E callouts.
          steps:
            - id: step-descriptor
              title: SPUG-FPGA emits descriptors
              detail: Descriptors are written at SDEP BAR1 + 0x1000..0x1700 carrying original address, length, type and tag.
              moduleNodeId: spug-fpga-nvme
              moduleRole: spug-fpga-nvme
              layers:
                - payload
            - id: step-overwrite
              title: Overwrite the proxied TLP header
              detail: Original address 0x3c000400000 is restored into s_spu_rq_tdata(63 downto 0).
              moduleNodeId: spu-fpga-addr-trans
              moduleRole: spu-fpga-addr-trans
              layers:
                - control
            - id: step-hit-bar4
              title: The RQ hits SUEP BAR4
              detail: The RQ reaches the SPU-side PCIe interface and lands in the 128GiB virtual BAR pool of SUEP BAR4.
              moduleNodeId: bar-suep-pool
              moduleRole: bar-suep-pool
              layers:
                - payload
            - id: step-restore
              title: Restore the physical address
              detail: "0x34000000000 + (0x3c000400000 - 0x3c000000000) = 0x34000400000, matching the measured Region 4: 128G @ 0x3c000000000."
              moduleNodeId: spu-ep-direct
              moduleRole: spu-ep-direct
              layers:
                - payload
          edges:
            - source: step-descriptor
              target: step-overwrite
              layer: control
              relation: CALL
            - source: step-overwrite
              target: step-hit-bar4
              layer: payload
              relation: PAYLOAD
            - source: step-hit-bar4
              target: step-restore
              layer: payload
              relation: STATE
