            description: Security services reach FPGA capabilities through PCS/protocol paths; the exact direct-MMIO boundary is not yet closed repository by repository.
            evidence: inferred
            protocol: SP37 protocol
        - id: host-block-sp37
          source: host-block
          target: host-sp37
          label: Secure block request
          fill: "#4d8edb"
          data:
            kind: DATA
            lane: DATA
            description: The optional Host block endpoint reuses the Host-SPU communication path.
            evidence: code
            protocol: block bridge
        - id: spu-sp37-block
          source: spu-sp37
          target: spu-block
          label: SPU block receive
          fill: "#4d8edb"
          data:
            kind: DATA
            lane: DATA
            description: The SPU block endpoint receives peer requests and exposes the block device.
            evidence: code
            protocol: block bridge
        - id: spu-block-device
          source: spu-block
          target: secure-block-device
          label: /dev/spu_mem_blk
          fill: "#d35f5f"
          data:
            kind: LIFECYCLE
            lane: LIFECYCLE
            description: sblkd_end creates the block device used by filesystems or bcache.
            evidence: code
            protocol: Linux block device
        - id: shutdown-platform-pcs
          source: spu-platform
          target: spu-pcs
          label: Stop upper requests
          fill: "#d35f5f"
          data:
            kind: LIFECYCLE
            lane: LIFECYCLE
            description: Before unload, stop new platform requests and drain PCS.
            evidence: inferred
            protocol: target shutdown order
        - id: shutdown-vendor-loader
          source: vendor-gpu-driver
          target: spu-gpu-loader
          label: Unload vendor modules
          fill: "#d35f5f"
          data:
            kind: LIFECYCLE
            lane: LIFECYCLE
            description: stop_spug.sh terminates device users and unloads GPU modules in reverse order.
            evidence: code
            protocol: rmmod
        - id: shutdown-virtual-suep
          source: virtual-gpu
          target: spu-vgpu
          label: Destroy virtual devices
          fill: "#d35f5f"
          data:
            kind: LIFECYCLE
            lane: LIFECYCLE
            description: Destroy vBEP/virtual PCI resources before unloading spu_vgpu.
            evidence: code
            protocol: vgpu_init / remove
        - id: shutdown-suep-sdep
          source: spu-vgpu
          target: host-sdep
          label: Stop NTB management
          fill: "#9b6bc4"
          data:
            kind: SYNC
            lane: SYNC
            description: Both sides stop interrupts and the management protocol; exact cross-system ordering requires runtime fault injection.
            evidence: inferred
            protocol: shutdown handshake
        - id: shutdown-sdep-sp37
          source: host-sdep
          target: host-sp37
          label: Unload base driver last
          fill: "#d35f5f"
          data:
            kind: LIFECYCLE
            lane: LIFECYCLE
            description: Unload the two SP37 endpoints only after SDEP/SUEP resource cleanup.
            evidence: inferred
            protocol: target rollback order
