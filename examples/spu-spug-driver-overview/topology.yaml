      - subdriver-spug
      - spug-control-pcie
      - spug-crypto-pcie
      - spug-physical-gpu
  - id: unload-reset-hotplug
    title:
      zhCN: 卸载、reset、热拔出与资源回收
      enUS: Unload, reset, hot-unplug, and resource reclamation
    summary:
      zhCN: 先停业务和厂商驱动，再销毁虚拟设备、停止 SUEP/SDEP，最后释放基础 SP37。
      enUS: Stop workloads and vendor drivers first, destroy virtual devices, stop SUEP/SDEP, then release the base SP37 path.
    caveat:
      zhCN: 局部 remove 函数有代码证据，但完整跨 Host/SPU 的严格逆序、reset 和热拔出仍是待验证目标顺序。
      enUS: Local remove functions are code-proven, but strict cross-Host/SPU reverse ordering, reset, and hot-unplug remain a target requiring validation.
    steps:
      - id: unload-reset-hotplug-s1
        nodeId: spu-platform
        title:
          zhCN: TSSD / NMS / Server / LibOS
          enUS: TSSD / NMS / Server / LibOS
        evidence: CODE_PROVEN
      - id: unload-reset-hotplug-s2
        nodeId: vendor-gpu-driver
        title:
          zhCN: 原生 GPU 厂商驱动
          enUS: Native GPU Vendor Driver
        evidence: INFERRED
      - id: unload-reset-hotplug-s3
        functionId: fn-vdevice-exit
        title:
          zhCN: suep_virtual_device_exit
          enUS: suep_virtual_device_exit
        evidence: CODE_PROVEN
      - id: unload-reset-hotplug-s4
        nodeId: spu-vgpu
        title:
          zhCN: spu_vgpu.ko / SUEP
          enUS: spu_vgpu.ko / SUEP
        evidence: CODE_PROVEN
      - id: unload-reset-hotplug-s5
        functionId: fn-sdep-remove
        title:
          zhCN: sdep_remove
          enUS: sdep_remove
        evidence: CODE_PROVEN
      - id: unload-reset-hotplug-s6
        nodeId: host-sp37
        title:
          zhCN: sp37.ko（Host）
          enUS: sp37.ko (Host)
        evidence: CODE_PROVEN
    edgeIds:
      - shutdown-platform-pcs
      - shutdown-vendor-loader
      - shutdown-virtual-suep
      - shutdown-suep-sdep
      - shutdown-sdep-sp37
functions:
  - id: fn-host-sp37-probe
    moduleId: host-sp37
    name: sp37_probe (Host)
    description: 绑定 Function 0 并建立 BAR、DMA、MSI-X 和字符设备。
    evidence: CODE_PROVEN
    contract: &a1
      trigger: PCI probe for 5709:1000
      context: Host kernel probe context
      consumes: pci_dev and BAR/MSI-X capabilities
      produces: Host SP37 device and character nodes
      stateResource: BAR mappings, DMA rings, IRQ vectors
      completionError: Success enables character I/O; failure unwinds acquired resources
      hardwareEffect: Maps PCI resources and enables bus mastering
    sources:
      - path: nereus/kernelspace/spu_pcied
        note: Function or implementation evidence
  - id: fn-host-pcs-send
    moduleId: host-pcs
    name: pcie_server send path
    description: 把本地消息编码后写入 SP37 H2C 字符设备。
    evidence: CODE_PROVEN
    contract: &a2
      trigger: Local client request
      context: Host userspace send thread
      consumes: IPC request and payload
      produces: SP37 protocol frame
      stateResource: send queue, socket session, device fd
      completionError: Write completes or returns bounded error
      hardwareEffect: Writes /dev/sp37_h2c_X
    sources:
      - path: nereus/nereus_pcie
        note: Function or implementation evidence
  - id: fn-spu-sp37-probe
    moduleId: spu-sp37
    name: sp37_probe (is_spu=1)
    description: 在 SPU CPU 侧建立同源 SP37 端点。
    evidence: CODE_PROVEN
    contract: &a3
      trigger: PCI probe for SPU-side 5709:1000
      context: SPU kernel probe context
      consumes: pci_dev and is_spu parameter
      produces: SPU SP37 device and character nodes
      stateResource: BAR mappings, DMA rings, IRQ vectors
      completionError: Success enables SPU PCS; failure rolls back resources
      hardwareEffect: Maps CPU-side PCI resources
    sources:
      - path: nereus/kernelspace/spu_pcied
        note: Function or implementation evidence
  - id: fn-spu-pcs-receive
    moduleId: spu-pcs
    name: pcie_server receive path
    description: 从 SP37 读取、寻找帧边界并分发给本地会话。
    evidence: CODE_PROVEN
    contract: &a4
      trigger: SP37 data/interrupt availability
      context: SPU userspace receive thread
      consumes: bytes from /dev/sp37_c2h_X
      produces: validated message for a local client
      stateResource: receive buffer, framing state, wait queues
      completionError: Dispatches a complete frame or isolates malformed input
      hardwareEffect: Reads SP37 character device
    sources:
      - path: nereus/nereus_pcie
        note: Function or implementation evidence
  - id: fn-sdep-probe
    moduleId: host-sdep
    name: sdep_probe
    description: 绑定 Function 1，映射 BAR 并初始化中断、sysfs 和 NTB。
    evidence: CODE_PROVEN
    contract: &a5
      trigger: PCI probe for 5709:1001
      context: Host kernel probe context
      consumes: Function 1 pci_dev
      produces: SDEP management endpoint
      stateResource: BAR maps, IRQ vectors, device tables
      completionError: Registers management state or unwinds on error
      hardwareEffect: Programs Function 1 BAR and MSI-X
    sources:
      - path: nereus/spu-g/sdep_driver/sdep_driver.c
        note: Function or implementation evidence
  - id: fn-spug-subdriver-init
    moduleId: host-spug-subdriver
    name: spug_driver_init
    description: SDEP 扫描到 SPUG 后映射其 BAR 并创建 sysfs。
    evidence: CODE_PROVEN
    contract: &a7
      trigger: SPUG discovered in Host PCI topology
      context: Host kernel SDEP management context
      consumes: 5709:2000 pci_dev
      produces: SPUG management object and sysfs
      stateResource: BAR0/BAR1 mappings and drvdata
      completionError: Returns success or releases mapped resources
      hardwareEffect: Enables SPUG PCI device and maps BARs
    sources:
      - path: nereus/spu-g/sdep_driver/spug_driver.c
        note: Function or implementation evidence
  - id: fn-suep-probe
    moduleId: spu-vgpu
    name: upstream_probe_one
    description: 绑定 SPU Function 1，建立 SUEP 管理根对象。
    evidence: CODE_PROVEN
    contract: &a6
      trigger: PCI probe for SPU-side 5709:1001
      context: SPU kernel probe context
      consumes: Function 1 pci_dev and NTB state
      produces: SUEP root object
      stateResource: BAR resources, DMA mask, IRQ and sysfs state
      completionError: Probe succeeds or unwinds resource acquisition
      hardwareEffect: Enables PCI function and NTB access
    sources:
      - path: nereus/spu-g/spu_driver/spu_upstream_driver.c
        note: Function or implementation evidence
  - id: fn-vdevice-init
    moduleId: spu-vgpu
    name: suep_virtual_device_init
    description: 按 Host 拓扑创建虚拟总线、vSPUG 和 vBEP。
    evidence: CODE_PROVEN
    contract: &a8
      trigger: SUEP topology initialization
      context: SPU kernel initialization context
      consumes: Host endpoint descriptors and SPUG count
      produces: Virtual PCI devices
      stateResource: virtual bus, vSPUG/vBEP ownership tables
      completionError: Devices become bindable or partial creation is rolled back
      hardwareEffect: Selects config-access and DMA-redirection modes
    sources:
      - path: nereus/spu-g/spu_driver/suep_virtual_device.c
        note: Function or implementation evidence
  - id: fn-dma-redirect
    moduleId: spu-kernel-hooks
    name: suep_hook_dma callback
    description: 把厂商驱动 DMA 映射转换为 SUEP/SPUG 可用地址关系。
    evidence: CODE_PROVEN
    contract: &a11
      trigger: Vendor driver DMA map/unmap
      context: SPU kernel DMA callback context
      consumes: pci_dev, DMA mapping, virtual-device ownership
      produces: redirected DMA mapping state
      stateResource: hook registration and mapping ownership
      completionError: Returns mapped state or fails closed; unmap must reverse it
      hardwareEffect: Changes device-visible DMA address mapping
    sources:
      - path: nereus/spu_kernel + nereus/spu-g
        note: Function or implementation evidence
  - id: fn-load-gpu-driver
    moduleId: spu-gpu-loader
    name: start_spug.sh
    description: 识别虚拟 GPU 并加载相应厂商模块。
    evidence: CODE_PROVEN
    contract: &a9
      trigger: SPUG service start after vGPU initialization
      context: SPU root userspace/systemd
      consumes: device IDs and backed-up kernel modules
      produces: loaded vendor GPU module set
      stateResource: module backup directory and service state
      completionError: Loads modules in order or stops with an error
      hardwareEffect: insmod vendor modules
    sources:
      - path: nereus/spu-g/config/start_spug.sh
        note: Function or implementation evidence
  - id: fn-vendor-bind
    moduleId: vendor-gpu-driver
    name: native PCI probe
    description: 厂商驱动绑定 SUEP 创建的虚拟 GPU。
    evidence: CODE_PROVEN
    contract: &a10
      trigger: Linux PCI device match
      context: SPU kernel vendor-driver probe
      consumes: virtual pci_dev and proxied resources
      produces: vendor GPU device instance
      stateResource: vendor-private state, IRQ and DMA mappings
      completionError: Device becomes usable or probe releases resources
      hardwareEffect: Programs proxied GPU resources
    sources:
      - path: Linux PCI model + nereus/spu-g virtual PCI
        note: Function or implementation evidence
  - id: fn-spug-state
    moduleId: spug-control
    name: spug_state_control
    description: 执行 SPUG 状态转换并门控数据面。
    evidence: RTL_PROVEN
    contract: &a12
      trigger: Host/SPU control command or hardware event
      context: SPUG RTL clocked state machine
      consumes: current state, authentication and error inputs
      produces: next state and path enables
      stateResource: state registers, timeout/error state
      completionError: Transitions to allowed state or Error
      hardwareEffect: Controls downstream power and traffic gates
    sources:
      - path: nereus_fpga/spug_fpga
        note: Function or implementation evidence
  - id: fn-spug-forward
    moduleId: spug-pcie
    name: sp37_p2p_bridge_u2d / d2u
    description: 组合、分发并转发四类 PCIe TLP。
    evidence: RTL_PROVEN
    contract: &a13
      trigger: Valid upstream or downstream TLP
      context: SPUG RTL PCIe data plane
      consumes: RQ/RC/CQ/CC streams and flow-control credits
      produces: forwarded TLP stream
      stateResource: FIFOs, tags, ordering and backpressure state
      completionError: TLP accepted/forwarded or held under backpressure
      hardwareEffect: Drives opposite PCIe port AXI-Stream
    sources:
      - path: nereus_fpga/spug_fpga
        note: Function or implementation evidence
  - id: fn-spug-crypto
    moduleId: spug-crypto
    name: spug_flow_cypher_ctrl
    description: 按安全状态对选中 payload 执行 GCM/SM4。
    evidence: RTL_PROVEN
    contract: &a14
      trigger: Secure flow selected by state/policy
      context: SPUG RTL crypto pipeline
      consumes: payload, key selection and direction
      produces: encrypted/decrypted payload
      stateResource: key slots, crypto pipeline and completion state
      completionError: Returns transformed payload or signals crypto error
      hardwareEffect: Feeds processed data back into PCIe flow
    sources:
      - path: nereus_fpga/spug_fpga
        note: Function or implementation evidence
  - id: fn-vdevice-exit
    moduleId: spu-vgpu
    name: suep_virtual_device_exit
    description: 销毁虚拟设备并回收虚拟总线资源。
    evidence: CODE_PROVEN
    contract: &a15
      trigger: SPUG service stop or module remove
      context: SPU kernel teardown context
      consumes: vSPUG/vBEP ownership state
      produces: released virtual PCI resources
      stateResource: device lists, IRQ and mapping ownership
      completionError: Completes only after child devices are released
      hardwareEffect: Removes device-visible virtual PCI objects
    sources:
      - path: nereus/spu-g/spu_driver/suep_virtual_device.c
        note: Function or implementation evidence
  - id: fn-sdep-remove
    moduleId: host-sdep
    name: sdep_remove
    description: 停止 NTB/sysfs/IRQ 并释放 SDEP 资源。
    evidence: CODE_PROVEN
    contract: &a16
      trigger: Module unload or PCI remove
      context: Host kernel remove context
      consumes: SDEP state and SPUG child objects
      produces: released Host management resources
      stateResource: BAR maps, IRQ, sysfs and topology tables
      completionError: Unwinds in reverse order; cross-host ordering remains unverified
      hardwareEffect: Disables Function 1 resources
    sources:
      - path: nereus/spu-g/sdep_driver/sdep_driver.c
        note: Function or implementation evidence
