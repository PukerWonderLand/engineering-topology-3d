        startup-lifecycle:
          eyebrow: SPU-SPUG-DRIVERS
          title: Startup and teardown lifecycle
          detail: Shows probe, service startup, GPU binding, and reverse-order cleanup by dependency.
        sp37-startup-pcs:
          eyebrow: CAUSAL JOURNEY
          title: SP37 dual-side startup and PCS communication
          detail: From Host/SPU Function 0 probes to the bidirectional PCS message loop.
        sdep-suep-virtualization:
          eyebrow: CAUSAL JOURNEY
          title: SDEP/SUEP initialization and virtual-device creation
          detail: Host SDEP passes device topology through NTB to SPU SUEP, which creates a virtual PCI GPU.
        gpu-bind-dma:
          eyebrow: CAUSAL JOURNEY
          title: Native GPU driver binding and DMA redirection
          detail: SPU scripts load vendor modules, which bind the virtual GPU; DMA enters the SUEP/SPUG address path through custom hooks.
        spug-secure-tlp:
          eyebrow: CAUSAL JOURNEY
          title: SPUG GPU TLP and secure-state path
          detail: The SPUG state machine gates upstream/downstream TLPs and invokes key/GCM/SM4 processing in secure mode.
        unload-reset-hotplug:
          eyebrow: CAUSAL JOURNEY
          title: Unload, reset, hot-unplug, and resource reclamation
          detail: Stop workloads and vendor drivers first, destroy virtual devices, stop SUEP/SDEP, then release the base SP37 path.
