          data:
            title: Host 业务网口 / LOM
            plane: host-platform
            layer: 区域 06 · 固件与操作系统
            kind: device
            description: 承载 Ubuntu 业务网络，与 BMC 专用管理口逻辑隔离；共享 BMC 的准确 NC-SI 绑定待确认。
            evidence: target
