      topologyEdges:
        - id: browser-blackbox
          source: operator-browser
          target: blackbox-web
          label: 查看启动记录
          data:
            kind: CONTROL
            lane: UI
            description: 局域网 HTTP 访问黑匣子页面。
            evidence: target
            protocol: HTTP
        - id: windows-scene
          source: windows-copy
          target: operator-browser
          label: 本地 3D 渲染
          data:
            kind: DATA
            lane: UI
            description: Windows 启动 Vite 后由浏览器加载本场景。
            evidence: code
            protocol: HTTP
        - id: nas-gateway
          source: nas-iso
          target: media-gateway
          label: 获取 ISO
          data:
            kind: DATA
            lane: MEDIA
            description: 管理节点使用现代 SMB 客户端读取镜像。
            evidence: target
            protocol: SMB2/3
        - id: blackbox-store
          source: event-store
          target: blackbox-web
          label: 会话查询
          data:
            kind: DATA
            lane: TELEMETRY
            description: Web 层读取按启动会话组织的事件。
            evidence: code
        - id: adapter-store
          source: bmc-adapter
          target: event-store
          label: 写入事件
          data:
            kind: DATA
            lane: TELEMETRY
            description: 记录 SOL、POST、SEL 和采集器状态。
            evidence: code
        - id: orchestrator-adapter
          source: boot-orchestrator
          target: bmc-adapter
          label: 调用 BMC 能力
          data:
            kind: CONTROL
            lane: CONTROL
            description: 编排器通过适配层执行厂商 API 与 IPMI 操作。
            evidence: code
        - id: gateway-cache
          source: media-gateway
          target: iso-cache
          label: 校验并缓存
          data:
            kind: CONTROL
            lane: MEDIA
            description: SHA-256 校验后保存可导出的本地文件。
            evidence: target
        - id: cache-bmc
          source: iso-cache
          target: bmc-services
          label: BMC 拉取 ISO
          data:
            kind: DATA
            lane: MEDIA
            description: BMC 内置 NFS 客户端从受限只读 NFSv3 导出读取镜像。
            evidence: target
            protocol: NFSv3
        - id: adapter-switch
          source: bmc-adapter
          target: mgmt-switch
          label: 管理协议流量
          data:
            kind: PHYSICAL
            lane: MGMT_NETWORK
            description: 管理节点经局域网访问 BMC。
            evidence: target
            protocol: Ethernet
        - id: switch-dedicated
          source: mgmt-switch
          target: bmc-dedicated-lan
          label: 专用管理以太网
          data:
            kind: PHYSICAL
            lane: MGMT_NETWORK
            description: 当前已验证的主要带外管理路径。
            evidence: target
            protocol: 1GbE
        - id: switch-shared
          source: mgmt-switch
          target: bmc-shared-lan
          label: 共享管理入口候选
          dashed: true
          data:
            kind: PHYSICAL
            lane: MGMT_NETWORK
            description: 共享通道存在，但当前未配置 IP，也未证实连接到哪一个 Host LOM。
            evidence: inference
            protocol: Ethernet / NC-SI
        - id: dedicated-soc
          source: bmc-dedicated-lan
          target: bmc-soc
          label: BMC MAC/网络控制器
          data:
            kind: PHYSICAL
            lane: MGMT_NETWORK
            description: 将专用管理口流量送入 BMC SoC。
            evidence: target
        - id: shared-soc
          source: bmc-shared-lan
          target: bmc-soc
          label: 共享通道逻辑连接
          dashed: true
          data:
            kind: PHYSICAL
            lane: MGMT_NETWORK
            description: BMC 通道存在已观察，内部具体 MAC/NC-SI 路径待确认。
            evidence: inference
        - id: soc-flash
          source: bmc-flash
          target: bmc-soc
          label: 固件启动
          data:
            kind: CONTROL
            lane: BMC_INTERNAL
            description: BMC 从独立非易失存储加载固件；本机实现细节待确认。
            evidence: inference
            protocol: SPI candidate
        - id: soc-dram
          source: bmc-dram
          target: bmc-soc
          label: BMC 工作内存
          data:
            kind: PHYSICAL
            lane: BMC_INTERNAL
            description: 供固件与视频缓冲使用，精确接口待确认。
            evidence: inference
        - id: soc-services
          source: bmc-soc
          target: bmc-services
          label: 运行内置服务
          data:
            kind: CONTROL
            lane: BMC_INTERNAL
            description: BMC SoC 执行 MegaRAC 固件服务。
            evidence: target
        - id: services-sol
          source: bmc-services
          target: host-uart
          label: SOL 封装/解封装
          data:
            kind: DATA
            lane: CONSOLE
            description: UART 字节经 IPMI v2.0/RMCP+ SOL 在管理网络上传输。
            evidence: target
            protocol: SOL 115200 8N1
        - id: uart-host
          source: host-uart
          target: ubuntu-host
          label: 串口控制台
          data:
            kind: DATA
            lane: CONSOLE
            description: 覆盖内核/systemd/login；BIOS 串口输出是否完整取决于固件 Console Redirection 配置。
            evidence: target
            protocol: ttyS0 115200 8N1
        - id: services-usb
          source: bmc-services
          target: usb-emulation
          label: 配置 USB 仿真
          data:
            kind: CONTROL
            lane: VIRTUAL_MEDIA
            description: BMC 内置固件控制虚拟介质和 HID 仿真。
            evidence: target
        - id: usb-cdrom
          source: usb-emulation
          target: virtual-cdrom
          label: 模拟 USB 光驱
          data:
            kind: PHYSICAL
            lane: VIRTUAL_MEDIA
            description: Host 看到 BMC Virtual CDROM0/1。
            evidence: target
            protocol: USB mass storage
        - id: cdrom-uefi
          source: virtual-cdrom
          target: host-uefi
          label: UEFI 枚举与启动
          data:
            kind: CONTROL
            lane: BOOT
            description: 一次性 Boot Override 选择远程光驱。
            evidence: target
        - id: uefi-ubuntu
          source: host-uefi
          target: ubuntu-host
          label: 加载 GRUB 与 Ubuntu
          data:
            kind: CONTROL
            lane: BOOT
            description: 实测到达 Ubuntu Live 图形环境，未执行磁盘安装。
            evidence: target
        - id: video-host
          source: host-uefi
          target: video-capture
          label: POST/UEFI 视频
          data:
            kind: DATA
            lane: KVM
            description: 固件画面进入 BMC KVM 捕获路径。
            evidence: target
        - id: video-services
          source: video-capture
          target: bmc-services
          label: KVM 视频流
          data:
            kind: DATA
            lane: KVM
            description: BMC 将捕获的视频编码并通过 Web/KVM 服务输出。
            evidence: target
        - id: services-power
          source: bmc-services
          target: power-post-control
          label: 上下电与复位命令
          data:
            kind: CONTROL
            lane: POWER
            description: IPMI/厂商 API 操作经侧带控制送往 Host。
            evidence: target
        - id: power-host
          source: power-post-control
          target: host-cpu-dram
          label: 电源/复位/POST 状态
          data:
            kind: CONTROL
            lane: POWER
            description: 控制主机生命周期并回读启动进度；精确电气接口待确认。
            evidence: target
        - id: sensors-bus
          source: sensors-fru
          target: sensor-bus
          label: 遥测与资产数据
          dashed: true
          data:
            kind: DATA
            lane: TELEMETRY
            description: 温度、电压、风扇、PSU 和 FRU 数据进入管理总线。
            evidence: inference
        - id: bus-services
          source: sensor-bus
          target: bmc-services
          label: 传感器/FRU 读取
          data:
            kind: DATA
            lane: TELEMETRY
            description: BMC 服务对外提供 SDR、SEL、传感器与 FRU。
            evidence: target
        - id: lom-shared
          source: host-lom
          target: bmc-shared-lan
          label: NC-SI 候选物理链路
          dashed: true
          data:
            kind: PHYSICAL
            lane: MGMT_NETWORK
            description: 共享管理通常经 NC-SI 复用某个 Host LOM，但本机准确端口尚未验证。
            evidence: inference
            protocol: NC-SI candidate
        - id: cpu-uefi
          source: host-cpu-dram
          target: host-uefi
          label: 执行平台固件
          data:
            kind: CONTROL
            lane: BOOT
            description: CPU 复位后执行 UEFI 初始化平台。
            evidence: target
        - id: cpu-os
          source: host-cpu-dram
          target: ubuntu-host
          label: 执行 Host OS
          data:
            kind: PHYSICAL
            lane: HOST
            description: Ubuntu 使用 Host CPU/DRAM。
            evidence: target
        - id: host-gpu
          source: host-cpu-dram
          target: nvidia-a10
          label: PCIe GPU 路径待实测
          dashed: true
          data:
            kind: PHYSICAL
            lane: PCIE
            description: 需要 lspci -tv、nvidia-smi topo -m 与 CUDA/GDS 检查确认。
            evidence: inference
            protocol: PCIe
        - id: host-nvme
          source: host-cpu-dram
          target: local-nvme
          label: PCIe NVMe 路径待实测
          dashed: true
          data:
            kind: PHYSICAL
            lane: PCIE
            description: 需要确认根端口、NUMA、IOMMU、文件系统与数据可擦除性。
            evidence: inference
            protocol: PCIe / NVMe
      viewOptions:
        - id: overview
          label: 物理全景
          hint: 从浏览器、管理节点、BMC 管理网络到服务器主板侧带链路、UEFI、虚拟介质及 A10/NVMe 测试设备的证据分层拓扑。
        - id: operator-source
          label: 操作端与镜像源
          hint: 浏览器、Windows 同步副本与公司 NAS
        - id: management-node
          label: 独立管理节点
          hint: 黑匣子、事件存储、BMC 适配器、启动编排与镜像网关
        - id: management-network
          label: 管理网络
          hint: 管理交换网络与 BMC 专用/共享管理端口
        - id: bmc-domain
          label: BMC 独立管理域
          hint: BMC SoC、固件存储、工作内存与内置管理服务
        - id: board-sideband
          label: 主板侧带链路
          hint: UART、USB、视频、传感器和电源/POST 控制
        - id: host-platform
          label: EG942H-G30 Host 平台
          hint: UEFI、虚拟光驱、CPU/DRAM、Ubuntu 与业务网口
        - id: pcie-devices
          label: PCIe 测试设备
          hint: 当前声明安装的 NVIDIA A10 与本地 NVMe
        - id: remote-iso-boot
          label: 远程 ISO 一次性启动
          hint: NAS 镜像经管理节点中继，由 BMC 拉取并模拟 USB 光驱，UEFI 启动 Ubuntu Live。
        - id: sol-blackbox
          label: SOL 启动黑匣子采集
          hint: Host 串口经 BMC SOL 到管理节点，并持续写入可查询的启动会话。
        - id: power-reset-observe
          label: 受控重启与状态观测
          hint: 人工确认后，编排器启动新会话、发出复位并并行记录 POST/SOL/SEL。
        - id: kvm-console
          label: BMC KVM 图形控制台
          hint: Host 视频经 BMC 捕获，键鼠经 USB HID 返回，覆盖 BIOS 到图形系统。
        - id: telemetry-inventory
          label: 传感器、SEL 与 FRU
          hint: 主板遥测和资产信息由 BMC 汇聚并由适配器记录。
        - id: shared-lan-path
          label: BMC 共享管理口候选路径
          hint: 共享通道可能通过 NC-SI 复用 Host LOM，但当前仅确认逻辑通道存在。
        - id: gds-readiness
          label: A10 + 本地 NVMe 的 GDS 环境确认
          hint: 先确认设备、驱动、拓扑和 P2P 能力，再进行任何非破坏性 GDS 验证。
      systemTree:
        - label: 操作端与镜像源
          plane: operator-source
          nodes: *a28
        - label: 独立管理节点
          plane: management-node
          nodes: *a29
        - label: 管理网络
          plane: management-network
          nodes: *a30
        - label: BMC 独立管理域
          plane: bmc-domain
          nodes: *a31
        - label: 主板侧带链路
          plane: board-sideband
          nodes: *a32
        - label: EG942H-G30 Host 平台
          plane: host-platform
          nodes: *a33
        - label: PCIe 测试设备
          plane: pcie-devices
          nodes: *a34
      storageTrees:
        - id: blackbox-web-sources
          label: 启动监控黑匣子 Web
          plane: management-node
          roots:
            - path: external/eg942h-g30-boot-web/boot_web.py
              role: Existing black-box web service on the management node; not bundled in this public scene.
              nodeId: blackbox-web
        - id: bmc-adapter-sources
          label: BMC 适配层
          plane: management-node
          roots:
            - path: external/eg942h-g30-boot-recorder/bmc_boot_recorder.py
              role: Existing recorder/adapter implementation on the management node.
              nodeId: bmc-adapter
      runtimeFacts:
        - label: 证据等级
          value: RUNTIME_OBSERVED
          tone: good
