functions:
  - id: recorder.capture-sol
    moduleId: bmc-adapter
    name: capture_sol
    description: 持续采集 SOL 字节并写入启动事件。
    evidence: CODE_PROVEN
    contract: &a8
      trigger: collector process active
      context: IPMI SOL session
      consumes: UART bytes and reconnect errors
      produces: raw/timestamped/JSONL events
      stateResource: current boot session
      completionError: reconnect with error event
  - id: recorder.poll-post
    moduleId: bmc-adapter
    name: poll_post_sel
    description: 轮询 POST、SEL 与主机电源状态。
    evidence: CODE_PROVEN
    contract: &a10
      trigger: periodic timer
      context: authenticated BMC session
      consumes: POST/SEL/power responses
      produces: telemetry events
      stateResource: session event timeline
      completionError: record timeout and retry
  - id: recorder.start-cycle
    moduleId: event-store
    name: start_boot_cycle
    description: 自动或人工建立新的启动会话边界。
    evidence: CODE_PROVEN
    contract: &a9
      trigger: detected power transition or manual action
      context: black-box recorder
      consumes: prior session state
      produces: new session metadata
      stateResource: boot session index
      completionError: retain current session and report failure
  - id: adapter.vendor-login
    moduleId: bmc-adapter
    name: vendor_api_login
    description: 登录现有 MegaRAC HTTPS API 并维护 CSRF 会话。
    evidence: RUNTIME_OBSERVED
    contract:
      trigger: orchestration request
      context: management LAN and configured secret store
      consumes: endpoint alias and protected credentials
      produces: authenticated API session
      stateResource: short-lived cookie and CSRF token
      completionError: abort without exposing credentials
  - id: media.prepare
    moduleId: media-gateway
    name: prepare_remote_media
    description: 从 NAS 拉取、校验并以受限只读协议提供 ISO。
    evidence: RUNTIME_OBSERVED
    contract: &a1
      trigger: selected ISO alias
      context: management node filesystem
      consumes: SMB source and expected SHA-256
      produces: verified NFSv3/HTTP media endpoint
      stateResource: local ISO cache
      completionError: reject media on copy or hash failure
  - id: boot.mount-media
    moduleId: boot-orchestrator
    name: configure_vendor_remote_media
    description: 调用 BMC 既有厂商接口配置远程介质，而不是向 BMC 上传程序。
    evidence: RUNTIME_OBSERVED
    contract: &a2
      trigger: verified media available
      context: authenticated vendor API
      consumes: NFS endpoint and ISO alias
      produces: connected virtual CDROM
      stateResource: BMC remote-media configuration
      completionError: disconnect partial mapping and report error
      hardwareEffect: BMC USB gadget exposes mass-storage device
  - id: boot.override
    moduleId: boot-orchestrator
    name: set_one_time_uefi_cd
    description: 设置仅下一次从 UEFI 虚拟光驱启动。
    evidence: RUNTIME_OBSERVED
    contract: &a4
      trigger: virtual CD connected
      context: IPMI/vendor API
      consumes: boot target cdrom and UEFI option
      produces: one-time boot override
      stateResource: BMC boot flags
      completionError: do not reset Host if boot flag cannot be verified
      hardwareEffect: UEFI selects BMC virtual CD on next reset
  - id: boot.reset
    moduleId: boot-orchestrator
    name: reset_host
    description: 在记录器已工作的前提下触发 Host 重启。
    evidence: RUNTIME_OBSERVED
    contract: &a5
      trigger: explicit operator action
      context: active capture session
      consumes: verified boot plan
      produces: Host power/reset transition
      stateResource: boot state machine
      completionError: record BMC error and preserve evidence
      hardwareEffect: asserts server power/reset control
  - id: bmc.fetch-iso
    moduleId: bmc-services
    name: fetch_remote_iso
    description: BMC 内置 NFS 客户端按配置拉取 ISO 块。
    evidence: RUNTIME_OBSERVED
    contract: &a3
      trigger: remote-media connect
      context: BMC firmware
      consumes: NFSv3 file blocks
      produces: USB mass-storage backing data
      stateResource: remote-media session
      completionError: expose media error and disconnect
  - id: bmc.sol
    moduleId: bmc-services
    name: encapsulate_sol
    description: 将 Host UART 字节封装为 IPMI SOL 数据。
    evidence: RUNTIME_OBSERVED
    contract: &a7
      trigger: UART receive or remote keystroke
      context: active RMCP+ SOL payload
      consumes: UART bytes or SOL payload
      produces: SOL payload or UART bytes
      stateResource: SOL session and retry counters
      completionError: terminate stale payload and permit reconnect
      hardwareEffect: transmits/receives Host UART
  - id: uefi.boot-cd
    moduleId: host-uefi
    name: boot_virtual_cd
    description: 枚举虚拟 CD 并启动其中的 UEFI 引导程序。
    evidence: RUNTIME_OBSERVED
    contract: &a6
      trigger: Host reset with one-time CD override
      context: UEFI boot manager
      consumes: USB mass-storage blocks and boot entry
      produces: GRUB and Ubuntu loader execution
      stateResource: UEFI boot attempt
      completionError: fall through or stop according to firmware policy
      hardwareEffect: CPU executes code loaded from virtual CD
  - id: bmc.read-sensors
    moduleId: bmc-services
    name: read_sensors_fru_sel
    description: 读取传感器、FRU 与 SEL 数据供管理面使用。
    evidence: RUNTIME_OBSERVED
    contract: &a11
      trigger: IPMI or web query
      context: BMC management firmware
      consumes: board telemetry and event records
      produces: SDR/FRU/SEL response
      stateResource: BMC sensor and event repositories
      completionError: return unavailable sensor or protocol error
journeys:
  - id: remote-iso-boot
    title:
      zhCN: 远程 ISO 一次性启动
      enUS: One-Time Remote ISO Boot
    summary:
      zhCN: NAS 镜像经管理节点中继，由 BMC 拉取并模拟 USB 光驱，UEFI 启动 Ubuntu Live。
      enUS: The NAS image is relayed by the management node, fetched by the BMC, emulated as USB CD, and booted by UEFI into Ubuntu Live.
    caveat:
      zhCN: 标准 Redfish InsertMedia 在本机返回 HTTP 500，实测成功路径是厂商 MegaRAC API + NFSv3；未执行磁盘安装。
      enUS: Standard Redfish InsertMedia returned HTTP 500; the observed successful path uses the vendor MegaRAC API plus NFSv3. No disk installation was performed.
    steps:
      - id: rib-1
        nodeId: nas-iso
        title:
          zhCN: 选择 NAS ISO
          enUS: Select NAS ISO
        evidence: RUNTIME_OBSERVED
      - id: rib-2
        functionId: media.prepare
        title:
          zhCN: 拉取校验并中继
          enUS: Fetch verify and relay
        evidence: RUNTIME_OBSERVED
      - id: rib-3
        functionId: boot.mount-media
        title:
          zhCN: 配置远程介质
          enUS: Configure remote media
        evidence: RUNTIME_OBSERVED
      - id: rib-4
        functionId: bmc.fetch-iso
        title:
          zhCN: BMC 拉取 ISO
          enUS: BMC fetches ISO
        evidence: RUNTIME_OBSERVED
      - id: rib-5
        functionId: boot.override
        title:
          zhCN: 设置一次性 CD 启动
          enUS: Set one-time CD boot
        evidence: RUNTIME_OBSERVED
      - id: rib-6
        functionId: boot.reset
        title:
          zhCN: 重启 Host
          enUS: Reset Host
        evidence: RUNTIME_OBSERVED
      - id: rib-7
        functionId: uefi.boot-cd
        title:
          zhCN: UEFI 启动 Ubuntu Live
          enUS: UEFI boots Ubuntu Live
        evidence: RUNTIME_OBSERVED
    edgeIds:
      - nas-gateway
      - gateway-cache
      - cache-bmc
      - services-usb
      - usb-cdrom
      - cdrom-uefi
      - uefi-ubuntu
  - id: sol-blackbox
    title:
      zhCN: SOL 启动黑匣子采集
      enUS: SOL Boot Black-Box Capture
    summary:
      zhCN: Host 串口经 BMC SOL 到管理节点，并持续写入可查询的启动会话。
      enUS: Host serial flows through BMC SOL to the management node and is continuously persisted as queryable boot sessions.
    caveat:
      zhCN: 当前 OS 内核至登录阶段可见；完整 BIOS 文本还依赖 BIOS Console Redirection 是否在最早阶段输出到相同 UART。
      enUS: OS kernel through login is visible; complete BIOS text still depends on early firmware Console Redirection to the same UART.
    steps:
      - id: sol-1
        nodeId: host-uefi
        title:
          zhCN: 固件/系统产生串口输出
          enUS: Firmware/OS emits serial output
        evidence: RUNTIME_OBSERVED
      - id: sol-2
        nodeId: host-uart
        title:
          zhCN: UART 传送字节
          enUS: UART carries bytes
        evidence: RUNTIME_OBSERVED
      - id: sol-3
        functionId: bmc.sol
        title:
          zhCN: BMC 封装 SOL
          enUS: BMC encapsulates SOL
        evidence: RUNTIME_OBSERVED
      - id: sol-4
        functionId: recorder.capture-sol
        title:
          zhCN: 采集并重连
          enUS: Capture and reconnect
        evidence: CODE_PROVEN
      - id: sol-5
        nodeId: event-store
        title:
          zhCN: 写入事件文件
          enUS: Persist event files
        evidence: CODE_PROVEN
      - id: sol-6
        nodeId: blackbox-web
        title:
          zhCN: 浏览器查看会话
          enUS: Browser views sessions
        evidence: CODE_PROVEN
    edgeIds:
      - uart-host
      - services-sol
      - adapter-store
      - blackbox-store
      - browser-blackbox
  - id: power-reset-observe
    title:
      zhCN: 受控重启与状态观测
      enUS: Controlled Reset and State Observation
    summary:
      zhCN: 人工确认后，编排器启动新会话、发出复位并并行记录 POST/SOL/SEL。
      enUS: After operator confirmation, the orchestrator opens a session, resets the Host, and records POST/SOL/SEL in parallel.
    steps:
      - id: pro-1
        functionId: recorder.start-cycle
        title:
          zhCN: 建立人工启动边界
          enUS: Create manual boot boundary
        evidence: CODE_PROVEN
      - id: pro-2
