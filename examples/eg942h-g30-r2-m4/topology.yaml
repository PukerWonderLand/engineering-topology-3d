      topologyEdges:
        - id: browser-blackbox
          source: operator-browser
          target: blackbox-web
          label: View boot records
          data:
            kind: CONTROL
            lane: UI
            description: LAN HTTP access to the black-box web page.
            evidence: target
            protocol: HTTP
        - id: windows-scene
          source: windows-copy
          target: operator-browser
          label: Local 3D rendering
          data:
            kind: DATA
            lane: UI
            description: The browser loads this scene after Vite starts on Windows.
            evidence: code
            protocol: HTTP
        - id: nas-gateway
          source: nas-iso
          target: media-gateway
          label: Fetch ISO
          data:
            kind: DATA
            lane: MEDIA
            description: The management node reads the image using a modern SMB client.
            evidence: target
            protocol: SMB2/3
        - id: blackbox-store
          source: event-store
          target: blackbox-web
          label: Session query
          data:
            kind: DATA
            lane: TELEMETRY
            description: The web layer reads events grouped by boot session.
            evidence: code
        - id: adapter-store
          source: bmc-adapter
          target: event-store
          label: Persist events
          data:
            kind: DATA
            lane: TELEMETRY
            description: Records SOL, POST, SEL, and collector status.
            evidence: code
        - id: orchestrator-adapter
          source: boot-orchestrator
          target: bmc-adapter
          label: Invoke BMC capabilities
          data:
            kind: CONTROL
            lane: CONTROL
            description: The orchestrator uses the adapter for vendor API and IPMI operations.
            evidence: code
        - id: gateway-cache
          source: media-gateway
          target: iso-cache
          label: Verify and cache
          data:
            kind: CONTROL
            lane: MEDIA
            description: Persists an exportable local file after SHA-256 verification.
            evidence: target
        - id: cache-bmc
          source: iso-cache
          target: bmc-services
          label: BMC fetches ISO
          data:
            kind: DATA
            lane: MEDIA
            description: The BMC built-in NFS client reads the image from a restricted read-only NFSv3 export.
            evidence: target
            protocol: NFSv3
        - id: adapter-switch
          source: bmc-adapter
          target: mgmt-switch
          label: Management protocol traffic
          data:
            kind: PHYSICAL
            lane: MGMT_NETWORK
            description: The management node reaches the BMC over the LAN.
            evidence: target
            protocol: Ethernet
        - id: switch-dedicated
          source: mgmt-switch
          target: bmc-dedicated-lan
          label: Dedicated management Ethernet
          data:
            kind: PHYSICAL
            lane: MGMT_NETWORK
            description: Currently verified primary out-of-band management path.
            evidence: target
            protocol: 1GbE
        - id: switch-shared
          source: mgmt-switch
          target: bmc-shared-lan
          label: Shared-management ingress candidate
          dashed: true
          data:
            kind: PHYSICAL
            lane: MGMT_NETWORK
            description: A shared channel exists but has no configured IP and is not yet mapped to a specific Host LOM.
            evidence: inference
            protocol: Ethernet / NC-SI
        - id: dedicated-soc
          source: bmc-dedicated-lan
          target: bmc-soc
          label: BMC MAC/network controller
          data:
            kind: PHYSICAL
            lane: MGMT_NETWORK
            description: Carries dedicated-port traffic into the BMC SoC.
            evidence: target
        - id: shared-soc
          source: bmc-shared-lan
          target: bmc-soc
          label: Shared-channel logical attachment
          dashed: true
          data:
            kind: PHYSICAL
            lane: MGMT_NETWORK
            description: The BMC channel is observed; its exact internal MAC/NC-SI path awaits confirmation.
            evidence: inference
        - id: soc-flash
          source: bmc-flash
          target: bmc-soc
          label: Firmware boot
          data:
            kind: CONTROL
            lane: BMC_INTERNAL
            description: The BMC loads firmware from independent nonvolatile storage; implementation details await confirmation.
            evidence: inference
            protocol: SPI candidate
        - id: soc-dram
          source: bmc-dram
          target: bmc-soc
          label: BMC working memory
          data:
            kind: PHYSICAL
            lane: BMC_INTERNAL
            description: Used by firmware and video buffering; exact interface awaits confirmation.
            evidence: inference
        - id: soc-services
          source: bmc-soc
          target: bmc-services
          label: Run built-in services
          data:
            kind: CONTROL
            lane: BMC_INTERNAL
            description: The BMC SoC executes MegaRAC firmware services.
            evidence: target
        - id: services-sol
          source: bmc-services
          target: host-uart
          label: SOL encapsulation/decapsulation
          data:
            kind: DATA
            lane: CONSOLE
            description: UART bytes are transported as IPMI v2.0/RMCP+ SOL over the management network.
            evidence: target
            protocol: SOL 115200 8N1
        - id: uart-host
          source: host-uart
          target: ubuntu-host
          label: Serial console
          data:
            kind: DATA
            lane: CONSOLE
            description: Covers kernel/systemd/login; complete BIOS serial output depends on firmware Console Redirection settings.
            evidence: target
            protocol: ttyS0 115200 8N1
        - id: services-usb
          source: bmc-services
          target: usb-emulation
          label: Configure USB emulation
          data:
            kind: CONTROL
            lane: VIRTUAL_MEDIA
            description: Built-in BMC firmware controls virtual media and HID emulation.
            evidence: target
        - id: usb-cdrom
          source: usb-emulation
          target: virtual-cdrom
          label: Emulate USB optical drive
          data:
            kind: PHYSICAL
            lane: VIRTUAL_MEDIA
            description: The Host sees BMC Virtual CDROM0/1.
            evidence: target
            protocol: USB mass storage
        - id: cdrom-uefi
          source: virtual-cdrom
          target: host-uefi
          label: UEFI enumeration and boot
          data:
            kind: CONTROL
            lane: BOOT
            description: One-time Boot Override selects the remote optical drive.
            evidence: target
        - id: uefi-ubuntu
          source: host-uefi
          target: ubuntu-host
          label: Load GRUB and Ubuntu
          data:
            kind: CONTROL
            lane: BOOT
            description: Observed reaching the Ubuntu live graphical environment without disk installation.
            evidence: target
        - id: video-host
          source: host-uefi
          target: video-capture
          label: POST/UEFI video
          data:
            kind: DATA
            lane: KVM
            description: Firmware video enters the BMC KVM capture path.
            evidence: target
        - id: video-services
          source: video-capture
          target: bmc-services
          label: KVM video stream
          data:
            kind: DATA
            lane: KVM
            description: The BMC encodes captured video and exposes it through Web/KVM.
            evidence: target
        - id: services-power
          source: bmc-services
          target: power-post-control
          label: Power and reset commands
          data:
            kind: CONTROL
            lane: POWER
            description: IPMI/vendor API operations reach the Host through sideband control.
            evidence: target
        - id: power-host
          source: power-post-control
          target: host-cpu-dram
          label: Power/reset/POST state
          data:
            kind: CONTROL
            lane: POWER
            description: Controls Host lifecycle and reads boot progress; exact electrical interfaces await confirmation.
            evidence: target
        - id: sensors-bus
          source: sensors-fru
          target: sensor-bus
          label: Telemetry and inventory data
          dashed: true
          data:
            kind: DATA
            lane: TELEMETRY
            description: Temperature, voltage, fan, PSU, and FRU data enter the management bus.
            evidence: inference
        - id: bus-services
          source: sensor-bus
          target: bmc-services
          label: Sensor/FRU reads
          data:
            kind: DATA
            lane: TELEMETRY
            description: BMC services expose SDR, SEL, sensors, and FRU.
            evidence: target
        - id: lom-shared
          source: host-lom
          target: bmc-shared-lan
          label: Candidate NC-SI physical link
          dashed: true
          data:
            kind: PHYSICAL
            lane: MGMT_NETWORK
            description: Shared management typically reuses a Host LOM through NC-SI, but this server's exact port is not verified.
            evidence: inference
            protocol: NC-SI candidate
        - id: cpu-uefi
          source: host-cpu-dram
          target: host-uefi
          label: Execute platform firmware
          data:
            kind: CONTROL
            lane: BOOT
            description: The CPU executes UEFI to initialize the platform after reset.
            evidence: target
        - id: cpu-os
          source: host-cpu-dram
          target: ubuntu-host
          label: Execute Host OS
          data:
            kind: PHYSICAL
            lane: HOST
            description: Ubuntu runs on Host CPU/DRAM.
            evidence: target
        - id: host-gpu
          source: host-cpu-dram
          target: nvidia-a10
          label: PCIe GPU path pending verification
          dashed: true
          data:
            kind: PHYSICAL
            lane: PCIE
            description: Requires lspci -tv, nvidia-smi topo -m, and CUDA/GDS checks.
            evidence: inference
            protocol: PCIe
        - id: host-nvme
          source: host-cpu-dram
          target: local-nvme
          label: PCIe NVMe path pending verification
          dashed: true
          data:
            kind: PHYSICAL
            lane: PCIE
            description: Root port, NUMA, IOMMU, filesystem, and data-destructive test boundaries require confirmation.
            evidence: inference
            protocol: PCIe / NVMe
      viewOptions:
        - id: overview
          label: Overview
          hint: Evidence-tiered topology from browser and management node through BMC networking, board sideband links, UEFI, virtual media, and the A10/NVMe test devices.
        - id: operator-source
          label: Operator and Image Source
          hint: Browser, Windows working copy, and company NAS
        - id: management-node
          label: Independent Management Node
          hint: Black box, event store, BMC adapter, boot orchestration, and media gateway
        - id: management-network
          label: Management Network
          hint: Management switching and BMC dedicated/shared interfaces
        - id: bmc-domain
          label: BMC Independent Management Domain
          hint: BMC SoC, firmware storage, working memory, and built-in services
        - id: board-sideband
          label: Board Sideband Links
          hint: UART, USB, video, sensors, and power/POST control
        - id: host-platform
          label: EG942H-G30 Host Platform
          hint: UEFI, virtual CD, CPU/DRAM, Ubuntu, and production NIC
        - id: pcie-devices
          label: PCIe Test Devices
          hint: Currently declared NVIDIA A10 and local NVMe
        - id: remote-iso-boot
          label: One-Time Remote ISO Boot
          hint: The NAS image is relayed by the management node, fetched by the BMC, emulated as USB CD, and booted by UEFI into Ubuntu Live.
        - id: sol-blackbox
          label: SOL Boot Black-Box Capture
          hint: Host serial flows through BMC SOL to the management node and is continuously persisted as queryable boot sessions.
        - id: power-reset-observe
          label: Controlled Reset and State Observation
          hint: After operator confirmation, the orchestrator opens a session, resets the Host, and records POST/SOL/SEL in parallel.
        - id: kvm-console
          label: BMC KVM Graphical Console
          hint: Host video is captured by the BMC while keyboard/mouse return through USB HID, covering BIOS through the graphical OS.
        - id: telemetry-inventory
          label: Sensors, SEL, and FRU
          hint: Board telemetry and inventory are aggregated by the BMC and recorded by the adapter.
        - id: shared-lan-path
          label: Candidate BMC Shared-LAN Path
          hint: The shared channel may reuse a Host LOM through NC-SI, but only the logical channel is currently confirmed.
        - id: gds-readiness
          label: A10 + Local NVMe GDS Readiness
          hint: Confirm devices, drivers, topology, and P2P capability before any non-destructive GDS validation.
