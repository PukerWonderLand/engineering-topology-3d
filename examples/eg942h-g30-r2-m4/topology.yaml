      - adapter-switch
      - switch-dedicated
      - services-power
      - power-host
      - adapter-store
  - id: kvm-console
    title:
      zhCN: BMC KVM 图形控制台
      enUS: BMC KVM Graphical Console
    summary:
      zhCN: Host 视频经 BMC 捕获，键鼠经 USB HID 返回，覆盖 BIOS 到图形系统。
      enUS: Host video is captured by the BMC while keyboard/mouse return through USB HID, covering BIOS through the graphical OS.
    caveat:
