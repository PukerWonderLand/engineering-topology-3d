  - id: telemetry-inventory
    title:
      zhCN: 传感器、SEL 与 FRU
      enUS: Sensors, SEL, and FRU
    summary:
      zhCN: 主板遥测和资产信息由 BMC 汇聚并由适配器记录。
      enUS: Board telemetry and inventory are aggregated by the BMC and recorded by the adapter.
    caveat:
      zhCN: 协议能力和读数已观察，逐器件 I²C/SMBus/IPMB 物理连接仍属推断。
      enUS: Protocol capability and readings are observed; per-device I²C/SMBus/IPMB physical wiring remains inferred.
    steps:
      - id: tel-1
        nodeId: sensors-fru
        title:
          zhCN: 产生遥测/资产信息
          enUS: Produce telemetry/inventory
        evidence: RUNTIME_OBSERVED
      - id: tel-2
        nodeId: sensor-bus
        title:
          zhCN: 侧带总线汇聚
          enUS: Sideband bus aggregation
        evidence: INFERRED
      - id: tel-3
        functionId: bmc.read-sensors
        title:
          zhCN: BMC 读取并提供
          enUS: BMC reads and exposes
        evidence: RUNTIME_OBSERVED
      - id: tel-4
        functionId: recorder.poll-post
        title:
          zhCN: 适配器采集记录
          enUS: Adapter captures records
        evidence: CODE_PROVEN
    edgeIds:
      - sensors-bus
      - bus-services
      - adapter-store
  - id: shared-lan-path
    title:
      zhCN: BMC 共享管理口候选路径
      enUS: Candidate BMC Shared-LAN Path
    summary:
      zhCN: 共享通道可能通过 NC-SI 复用 Host LOM，但当前仅确认逻辑通道存在。
      enUS: The shared channel may reuse a Host LOM through NC-SI, but only the logical channel is currently confirmed.
    caveat:
      zhCN: 当前共享通道地址为 0.0.0.0，不能把图中的 NC-SI 连接视为本机板级定论。
      enUS: The shared channel currently has no address; the depicted NC-SI connection is not a board-level conclusion.
    steps:
      - id: slp-1
        nodeId: mgmt-switch
        title:
          zhCN: 管理流量进入业务网口
          enUS: Management traffic reaches LOM
        evidence: INFERRED
      - id: slp-2
        nodeId: host-lom
        title:
          zhCN: LOM 分流管理帧
          enUS: LOM diverts management frames
        evidence: INFERRED
      - id: slp-3
        nodeId: bmc-shared-lan
        title:
          zhCN: NC-SI 送入 BMC
          enUS: NC-SI delivers to BMC
        evidence: INFERRED
      - id: slp-4
        nodeId: bmc-soc
        title:
          zhCN: BMC 处理管理协议
          enUS: BMC handles management protocol
        evidence: INFERRED
    edgeIds:
      - switch-shared
      - lom-shared
      - shared-soc
  - id: gds-readiness
    title:
      zhCN: A10 + 本地 NVMe 的 GDS 环境确认
      enUS: A10 + Local NVMe GDS Readiness
    summary:
      zhCN: 先确认设备、驱动、拓扑和 P2P 能力，再进行任何非破坏性 GDS 验证。
      enUS: Confirm devices, drivers, topology, and P2P capability before any non-destructive GDS validation.
    caveat:
      zhCN: 本场景仅记录用户声明的安装状态，不声称 GDS 已部署或 PCIe P2P 已通过。
      enUS: This scene records user-declared installation only and does not claim that GDS is deployed or PCIe P2P has passed.
    steps:
      - id: gds-1
        nodeId: ubuntu-host
        title:
          zhCN: 检查 OS/内核/CUDA
          enUS: Check OS/kernel/CUDA
        evidence: RUNTIME_OBSERVED
      - id: gds-2
        nodeId: nvidia-a10
        title:
          zhCN: 确认 A10 驱动与拓扑
          enUS: Verify A10 driver and topology
        evidence: INFERRED
      - id: gds-3
        nodeId: local-nvme
        title:
          zhCN: 确认 NVMe 与安全测试盘
          enUS: Verify NVMe and safe test media
        evidence: INFERRED
      - id: gds-4
        nodeId: host-cpu-dram
        title:
          zhCN: 判断 PCIe 根端口/P2P 路径
          enUS: Determine PCIe root/P2P path
        evidence: INFERRED
    edgeIds:
      - host-gpu
      - host-nvme
