schemaVersion: "2.0"
id: nvme-bitmap
title:
  zhCN: NVMe Bitmap 透明加解密架构
  enUS: NVMe Bitmap Transparent Crypto Topology
description:
  zhCN: Host 保留 NVMe 控制权，SPU/FPGA 根据登记的 DMA/IOVA 页面处理 PCIe payload。
  enUS: The host retains NVMe control while SPU/FPGA processes PCIe payload for registered DMA/IOVA pages.
evidence: INFERRED
locales:
  default: zh-CN
  supported:
    - zh-CN
    - en-US
zones:
  - id: host-userspace
    title: &a27
      zhCN: Host 用户态
      enUS: Host Userspace
    eyebrow: &a26
      zhCN: 区域 01 · 控制面
      enUS: ZONE 01 · CONTROL PLANE
    summary: &a28
      zhCN: 应用 / 管理 / 策略
      enUS: Application / management / policy
    color: "#22a7cf"
    nodeIds: &a4
      - nvme-app
      - bitmap-manager
  - id: host-kernel
    title: &a31
      zhCN: Host Linux 内核
      enUS: Host Linux Kernel
    eyebrow: &a30
      zhCN: 区域 02 · NVMe 与 DMA
      enUS: ZONE 02 · NVME AND DMA
    summary: &a32
      zhCN: nvme.ko / DMA 映射 / Bitmap 登记
      enUS: nvme.ko / DMA mapping / Bitmap registration
    color: "#7657c8"
    nodeIds: &a5
      - nvme-driver
      - dma-map
      - bitmap-register
  - id: pcie-path
    title: &a35
      zhCN: PCIe 数据路径
      enUS: PCIe Data Path
    eyebrow: &a34
      zhCN: 区域 03 · 事务层
      enUS: ZONE 03 · TRANSACTION LAYER
    summary: &a36
      zhCN: NVMe payload 与地址信息
      enUS: NVMe payload and address information
    color: "#2f83e7"
    nodeIds: &a6
      - pcie-root
      - pcie-payload
  - id: spu-fpga
    title: &a39
      zhCN: SPU / FPGA Bitmap 引擎
      enUS: SPU / FPGA Bitmap Engine
    eyebrow: &a38
      zhCN: 区域 04 · 数据面
      enUS: ZONE 04 · DATA PLANE
    summary: &a40
      zhCN: 页面命中 / 透明加解密 / 转发
      enUS: Page match / transparent crypto / forwarding
    color: "#168f7b"
    nodeIds: &a7
      - bitmap-table
      - crypto-engine
      - pcie-forward
  - id: nvme-device
    title: &a43
      zhCN: 物理 NVMe 设备
      enUS: Physical NVMe Device
    eyebrow: &a42
      zhCN: 区域 05 · 存储端
      enUS: ZONE 05 · STORAGE TARGET
    summary: &a44
      zhCN: 控制器 / Namespace / NAND
      enUS: Controller / Namespace / NAND
    color: "#7fae3f"
    nodeIds: &a8
      - nvme-controller
      - nvme-media
nodes:
  - id: nvme-app
    zoneId: host-userspace
    title: &a46
      zhCN: NVMe 应用
      enUS: NVMe Application
    description:
      zhCN: 发起块设备 I/O。
      enUS: Issues block I/O.
    kind: application
    evidence: CODE_PROVEN
    color: "#22a7cf"
  - id: bitmap-manager
    zoneId: host-userspace
    title: &a48
      zhCN: Bitmap 策略管理
      enUS: Bitmap Policy Manager
    description:
      zhCN: 决定哪些 DMA 页面进入保护范围。
      enUS: Selects DMA pages covered by protection.
    kind: service
    evidence: INFERRED
    color: "#218c83"
  - id: nvme-driver
    zoneId: host-kernel
    title: &a50
      zhCN: Host nvme.ko
      enUS: Host nvme.ko
    description:
      zhCN: Host 保留 NVMe 队列与控制器所有权。
      enUS: The host retains NVMe queue and controller ownership.
    kind: driver
    evidence: CODE_PROVEN
    color: "#7657c8"
    sources:
      - path: drivers/nvme/host/pci.c
        note: Host NVMe PCI data path entry.
  - id: dma-map
    zoneId: host-kernel
    title: &a52
      zhCN: DMA / IOVA 映射
      enUS: DMA / IOVA Mapping
    description:
      zhCN: 建立设备可见地址及映射生命周期。
      enUS: Creates device-visible addresses and mapping lifetime.
    kind: driver
    evidence: CODE_PROVEN
    color: "#6969c4"
  - id: bitmap-register
    zoneId: host-kernel
    title: &a54
      zhCN: Bitmap 页面登记
      enUS: Bitmap Page Registration
    description:
      zhCN: 在门铃前登记、解除映射前释放。
      enUS: Register before doorbell and release before DMA unmap.
    kind: state
    evidence: CODE_PROVEN
    color: "#8a61d1"
  - id: pcie-root
    zoneId: pcie-path
    title: &a56
      zhCN: Host PCIe Root Complex
      enUS: Host PCIe Root Complex
    description:
      zhCN: 承载 NVMe TLP。
      enUS: Carries NVMe TLPs.
    kind: hardware
    evidence: CODE_PROVEN
    color: "#366f9c"
  - id: pcie-payload
    zoneId: pcie-path
    title: &a58
      zhCN: PCIe Payload
      enUS: PCIe Payload
    description:
      zhCN: 命令相关数据，不代表 SPU 接管 NVMe 协议。
      enUS: Command-related data; it does not imply SPU ownership of NVMe protocol.
    kind: data
    evidence: INFERRED
    color: "#2f83e7"
  - id: bitmap-table
    zoneId: spu-fpga
    title: &a60
      zhCN: Bitmap / 地址命中表
      enUS: Bitmap / Address Match Table
    description:
      zhCN: 依据登记页面判断是否处理 payload。
      enUS: Matches registered pages to decide payload handling.
    kind: state
    evidence: INFERRED
    color: "#13a681"
  - id: crypto-engine
    zoneId: spu-fpga
    title: &a62
      zhCN: 透明加解密引擎
      enUS: Transparent Crypto Engine
    description:
      zhCN: 对命中页面的数据透明处理。
      enUS: Transparently processes data for matched pages.
    kind: hardware
    evidence: INFERRED
    color: "#168f7b"
  - id: pcie-forward
    zoneId: spu-fpga
    title: &a64
      zhCN: PCIe 转发
      enUS: PCIe Forwarding
    description:
      zhCN: 保持事务路径继续到物理设备。
      enUS: Forwards transactions toward the physical device.
    kind: hardware
    evidence: INFERRED
    color: "#3abc9c"
  - id: nvme-controller
    zoneId: nvme-device
    title: &a66
      zhCN: NVMe 控制器
      enUS: NVMe Controller
    description:
      zhCN: 执行 NVMe 命令并访问介质。
      enUS: Executes NVMe commands and accesses media.
    kind: device
    evidence: CODE_PROVEN
    color: "#7fae3f"
  - id: nvme-media
    zoneId: nvme-device
    title: &a68
      zhCN: Namespace / NAND
      enUS: Namespace / NAND
    description:
      zhCN: 最终持久化介质。
      enUS: Final persistent media.
    kind: hardware
    evidence: CODE_PROVEN
    color: "#9dbd5d"
edges:
  - id: app-driver
    source: nvme-app
    target: nvme-driver
    title:
      zhCN: 块 I/O
      enUS: Block I/O
    description:
      zhCN: 系统调用与块层请求。
      enUS: System call and block request.
    kind: control
    evidence: CODE_PROVEN
    color: "#708090"
    lane: CONTROL
  - id: manager-register
    source: bitmap-manager
    target: bitmap-register
    title:
      zhCN: 策略
      enUS: Policy
    description:
      zhCN: 登记保护范围。
      enUS: Registers protected scope.
    kind: control
    evidence: INFERRED
    color: "#8a61d1"
    dashed: true
    lane: CONTROL
  - id: driver-dma
    source: nvme-driver
    target: dma-map
    title:
      zhCN: DMA 映射
      enUS: DMA map
    description:
      zhCN: 获得设备可见地址。
      enUS: Obtains a device-visible address.
    kind: lifecycle
    evidence: CODE_PROVEN
    color: "#e14b72"
    lane: LIFECYCLE
  - id: dma-bitmap
    source: dma-map
    target: bitmap-register
    title:
      zhCN: IOVA 页面
      enUS: IOVA pages
    description:
      zhCN: 登记页粒度地址。
      enUS: Registers page-granular addresses.
    kind: control
    evidence: CODE_PROVEN
    color: "#8a61d1"
    lane: CONTROL
  - id: driver-root
    source: nvme-driver
    target: pcie-root
    title:
      zhCN: Doorbell / TLP
      enUS: Doorbell / TLP
    description:
      zhCN: 登记完成后启动设备事务。
      enUS: Starts device transactions after registration.
    kind: control
    evidence: CODE_PROVEN
    color: "#f4a62a"
    lane: CONTROL
  - id: root-payload
    source: pcie-root
    target: pcie-payload
    title:
      zhCN: PCIe 数据
      enUS: PCIe data
    description:
      zhCN: 数据进入链路。
      enUS: Data enters the link.
    kind: payload
    evidence: CODE_PROVEN
    color: "#2f83e7"
    lane: PRIMARY
  - id: payload-match
    source: pcie-payload
    target: bitmap-table
    title:
      zhCN: 地址匹配
      enUS: Address match
    description:
      zhCN: 查询页面命中状态。
      enUS: Checks page match state.
    kind: payload
    evidence: INFERRED
    color: "#13a681"
    dashed: true
    lane: PRIMARY
  - id: match-crypto
    source: bitmap-table
    target: crypto-engine
    title:
      zhCN: 命中页面
      enUS: Matched page
    description:
      zhCN: 只处理命中数据。
      enUS: Processes matched data only.
    kind: payload
    evidence: INFERRED
    color: "#168f7b"
    dashed: true
    lane: PRIMARY
  - id: crypto-forward
    source: crypto-engine
    target: pcie-forward
    title:
      zhCN: 处理后 payload
      enUS: Processed payload
    description:
      zhCN: 透明转发。
      enUS: Transparent forwarding.
    kind: payload
    evidence: INFERRED
    color: "#3abc9c"
    dashed: true
    lane: PRIMARY
  - id: forward-controller
    source: pcie-forward
    target: nvme-controller
    title:
      zhCN: NVMe PCIe
      enUS: NVMe PCIe
    description:
      zhCN: 到达物理控制器。
      enUS: Reaches the physical controller.
    kind: physical
    evidence: INFERRED
    color: "#5f86df"
    dashed: true
    lane: PHYSICAL
  - id: controller-media
    source: nvme-controller
    target: nvme-media
    title:
      zhCN: 介质访问
      enUS: Media access
    description:
      zhCN: 控制器访问 Namespace/NAND。
      enUS: Controller accesses Namespace/NAND.
    kind: payload
    evidence: CODE_PROVEN
    color: "#7fae3f"
    lane: PRIMARY
functions:
  - id: bitmap-prepare
    moduleId: bitmap-register
    name: bitmap_prepare_dma_pages
    description: Register DMA/IOVA pages before device submission.
    evidence: CODE_PROVEN
    contract: &a1
      trigger: NVMe request prepared
      context: host kernel process/submit context
      consumes: DMA mapped pages
      produces: Bitmap registration
      stateResource: page ownership and mapping lifetime
      completionError: registered or fail closed
      hardwareEffect: Bitmap visible before doorbell
  - id: bitmap-release
    moduleId: bitmap-register
    name: bitmap_release_dma_pages
    description: Remove registration before DMA unmap.
    evidence: CODE_PROVEN
    contract: &a3
      trigger: request completion or rollback
      context: host completion/error context
      consumes: registered pages
      produces: released Bitmap state
      stateResource: page ownership and mapping lifetime
      completionError: released before unmap
  - id: nvme-submit
    moduleId: nvme-driver
    name: nvme_queue_rq
    description: Representative host NVMe request submission station.
    evidence: CODE_PROVEN
    sources:
      - path: drivers/nvme/host/pci.c
        note: Representative Linux NVMe PCI submission path.
    contract: &a2
      trigger: blk-mq request
      context: host kernel submission context
      consumes: NVMe request and mapped buffers
      produces: queue entry / doorbell
      stateResource: submission queue and DMA mapping
      completionError: submitted, resource, or path error
      hardwareEffect: NVMe doorbell
journeys:
  - id: protected-write
    title:
      zhCN: 受保护写路径
      enUS: Protected Write Path
    summary:
      zhCN: Host 准备映射和 Bitmap，再触发 NVMe；SPU/FPGA 只处理命中 payload。
      enUS: The host prepares mappings and Bitmap before NVMe submission; SPU/FPGA handles matched payload only.
    caveat:
      zhCN: FPGA 如何匹配和处理页面仍需 RTL 或运行观测证明。
      enUS: FPGA page matching and processing still require RTL or runtime evidence.
    steps:
      - id: write-app
        nodeId: nvme-app
        title:
          zhCN: 发起写入
          enUS: Issue write
        evidence: CODE_PROVEN
      - id: write-prepare
        functionId: bitmap-prepare
        title:
          zhCN: 登记页面
          enUS: Register pages
        evidence: CODE_PROVEN
      - id: write-submit
        functionId: nvme-submit
        title:
          zhCN: 提交 NVMe
          enUS: Submit NVMe
        evidence: CODE_PROVEN
      - id: write-crypto
        nodeId: crypto-engine
        title:
          zhCN: 命中后处理
          enUS: Process after match
        evidence: INFERRED
      - id: write-media
        nodeId: nvme-media
        title:
          zhCN: 介质持久化
          enUS: Persist to media
        evidence: CODE_PROVEN
    edgeIds:
      - app-driver
      - driver-dma
      - dma-bitmap
      - driver-root
      - root-payload
      - payload-match
      - match-crypto
      - crypto-forward
      - forward-controller
      - controller-media
  - id: completion-release
    title:
      zhCN: 完成与释放
      enUS: Completion and Release
    summary:
      zhCN: 请求结束时先解除 Bitmap 登记，再解除 DMA 映射。
      enUS: At completion, Bitmap registration is released before DMA unmap.
    steps:
      - id: release-bitmap
        functionId: bitmap-release
        title:
          zhCN: 释放登记
          enUS: Release registration
        evidence: CODE_PROVEN
      - id: release-dma
        nodeId: dma-map
        title:
          zhCN: 解除 DMA 映射
          enUS: Unmap DMA
        evidence: CODE_PROVEN
    edgeIds:
      - dma-bitmap
