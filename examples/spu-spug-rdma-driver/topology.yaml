      viewOptions:
        - id: overview
          label: Overview
          hint: Maps RDMA MR lifecycle, custom kernel hooks, SUEP virtual devices, SPUG Bitmap, and the RNIC data plane.
        - id: rdma-userspace
          label: RDMA Userspace
          hint: Application, libibverbs, and MR operations
        - id: linux-rdma-core
          label: SPU Linux RDMA Kernel
          hint: RDMA core, ib_umem, irdma, and final DMA SG
        - id: kernel-hook-driver
          label: Custom Kernel Hook and Companion Driver
          hint: Get/release callbacks, device ownership, and legacy mapping
        - id: suep-virtualization
          label: SUEP Virtualization Layer
          hint: SUEP, virtual PCI bus, vSPUG, and RNIC vBEP
        - id: spug-security
          label: SPUG Resource and Crypto Data Plane
          hint: MMIO, Bitmap, crypto enable, and unified resource ownership
        - id: memory-and-device
          label: Memory and Physical Devices
          hint: Host DRAM, GPU peer memory, and physical RNIC
        - id: device-bringup
          label: Device Virtualization and RDMA Attach
          hint: From SUEP probe through vSPUG/vBEP creation to RDMA hook registration and hardware enable.
        - id: host-mr-register
          label: Host DRAM MR Registration and Bitmap Set
          hint: Final DMA addresses are captured after mapping, resolved to vBEP/vSPUG through the hook, and set at 4 KiB granularity.
        - id: mr-release
          label: MR Release and Bitmap Cleanup
          hint: Resolves the vSPUG from the historical map and clears ordinary-memory authorization before DMA unmap.
        - id: gdr-peer-boundary
          label: GDR / Peer Memory Evidence Boundary
          hint: Peer umem enters the same hook and stores ownership, but currently skips Host MR Bitmap.
        - id: safe-teardown-target
          label: Safe Teardown Target Path
          hint: Stop new callbacks, wait for in-flight work, drain MRs and hardware state, remove virtual devices, then release SUEP.
