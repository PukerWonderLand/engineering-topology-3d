          label: SPUG 资源与密码数据面
          hint: MMIO、Bitmap、加密使能与统一资源管理方向
        - id: memory-and-device
          label: 内存与物理设备
          hint: Host DRAM、GPU peer memory 与物理 RNIC
        - id: device-bringup
          label: 设备虚拟化与 RDMA 装配
          hint: 从 SUEP probe 到 vSPUG/vBEP 建立，再按 RDMA 模式注册 Hook 并启用硬件。
        - id: host-mr-register
          label: Host DRAM MR 注册与 Bitmap 置位
          hint: DMA map 完成后取得最终地址，通过 Hook 定位 vBEP/vSPUG，再按 4 KiB 粒度置位。
        - id: mr-release
          label: MR 释放与 Bitmap 清理
          hint: 在 DMA unmap 之前通过历史映射找回 vSPUG，并清除普通内存页授权。
        - id: gdr-peer-boundary
          label: GDR / Peer Memory 证据边界
          hint: peer umem 进入同一 Hook 并保存归属，但当前跳过 Host MR Bitmap。
        - id: safe-teardown-target
          label: 安全卸载目标路径
          hint: 先阻止新回调并等待在途操作，再 drain MR、清硬件状态、删除虚拟设备，最后释放 SUEP。
