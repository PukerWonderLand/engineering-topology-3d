journeys:
  - id: device-bringup
    title:
      zhCN: 设备虚拟化与 RDMA 装配
      enUS: Device Virtualization and RDMA Attach
    summary:
      zhCN: 从 SUEP probe 到 vSPUG/vBEP 建立，再按 RDMA 模式注册 Hook 并启用硬件。
      enUS: From SUEP probe through vSPUG/vBEP creation to RDMA hook registration and hardware enable.
    steps:
      - id: bringup-suep
        nodeId: suep-core
        functionId: suep-probe
        title:
          zhCN: SUEP probe
          enUS: SUEP probe
        evidence: CODE_PROVEN
      - id: bringup-bus
        nodeId: virtual-pci
        title:
          zhCN: 建立虚拟 PCI 总线
          enUS: Establish virtual PCI bus
        evidence: CODE_PROVEN
      - id: bringup-vspug
        nodeId: vspug
        functionId: create-vspug
        title:
          zhCN: 创建 vSPUG
          enUS: Create vSPUG
        evidence: CODE_PROVEN
      - id: bringup-vbep
        nodeId: vbep-rnic
        functionId: create-vbep
        title:
          zhCN: 创建 RNIC vBEP
          enUS: Create RNIC vBEP
        evidence: CODE_PROVEN
      - id: bringup-rdma
        nodeId: suep-rdma
        functionId: register-vbep
        title:
          zhCN: 装配 RDMA 扩展
          enUS: Attach RDMA extension
        evidence: CODE_PROVEN
      - id: bringup-regs
        nodeId: hardware-regs
        title:
          zhCN: 启用 RDMA 加解密
          enUS: Enable RDMA crypto
        evidence: CODE_PROVEN
    edgeIds:
      - suep-vpci
      - vpci-vspug
      - vpci-vbep
      - vspug-register
      - callback-regs
  - id: host-mr-register
    title:
      zhCN: Host DRAM MR 注册与 Bitmap 置位
      enUS: Host DRAM MR Registration and Bitmap Set
    summary:
      zhCN: DMA map 完成后取得最终地址，通过 Hook 定位 vBEP/vSPUG，再按 4 KiB 粒度置位。
      enUS: Final DMA addresses are captured after mapping, resolved to vBEP/vSPUG through the hook, and set at 4 KiB granularity.
    steps:
      - id: mr-app
        nodeId: rdma-app
        title:
          zhCN: 注册 MR
          enUS: Register MR
        evidence: CODE_PROVEN
      - id: mr-core
        nodeId: rdma-core
        functionId: umem-get
        title:
          zhCN: pin 页并 DMA map
          enUS: Pin pages and DMA map
        evidence: CODE_PROVEN
      - id: mr-umem
        nodeId: ib-umem
        title:
          zhCN: 最终 DMA SG 就绪
          enUS: Final DMA SG ready
        evidence: CODE_PROVEN
      - id: mr-hook
        nodeId: hook-rdma
        functionId: hook-get
        title:
          zhCN: 调用 get Hook
          enUS: Invoke get hook
        evidence: CODE_PROVEN
      - id: mr-route
        nodeId: suep-rdma
        functionId: rdma-get-cb
        title:
          zhCN: 定位 vBEP/vSPUG
          enUS: Resolve vBEP/vSPUG
        evidence: CODE_PROVEN
      - id: mr-map
        nodeId: umem-route-map
        title:
          zhCN: 保存 release 归属
          enUS: Save release ownership
        evidence: CODE_PROVEN
      - id: mr-bitmap
        nodeId: bitmap
        functionId: bitmap-set
        title:
          zhCN: Bitmap 置位
          enUS: Set Bitmap
        evidence: CODE_PROVEN
      - id: mr-rnic
        nodeId: physical-rnic
        title:
          zhCN: 允许 RDMA 数据事务
          enUS: Permit RDMA transaction
        evidence: RUNTIME_OBSERVED
    edgeIds:
      - app-core
      - core-umem
      - umem-hook-get
      - hook-callback
      - callback-map
      - callback-vbep
      - regs-bitmap
      - fpga-rnic
  - id: mr-release
    title:
      zhCN: MR 释放与 Bitmap 清理
      enUS: MR Release and Bitmap Cleanup
    summary:
      zhCN: 在 DMA unmap 之前通过历史映射找回 vSPUG，并清除普通内存页授权。
      enUS: Resolves the vSPUG from the historical map and clears ordinary-memory authorization before DMA unmap.
    caveat:
      zhCN: 当前实现未删除哈希条目，也没有解决重叠 MR 页引用计数。
      enUS: Current code does not remove hash entries and lacks page refcounting for overlapping MRs.
    steps:
      - id: release-app
        nodeId: rdma-app
        title:
          zhCN: 释放 MR
          enUS: Deregister MR
        evidence: CODE_PROVEN
      - id: release-core
        nodeId: rdma-core
        functionId: umem-release
        title:
          zhCN: 进入 ib_umem_release
          enUS: Enter ib_umem_release
        evidence: CODE_PROVEN
      - id: release-hook-step
        nodeId: hook-rdma
        functionId: hook-release
        title:
          zhCN: unmap 前回调
          enUS: Callback before unmap
        evidence: CODE_PROVEN
      - id: release-map-step
        nodeId: umem-route-map
        title:
          zhCN: 查询 vBEP 索引
          enUS: Lookup vBEP index
        evidence: CODE_PROVEN
      - id: release-bitmap
        nodeId: bitmap
        functionId: bitmap-clear
        title:
          zhCN: Bitmap 清位
          enUS: Clear Bitmap
        evidence: CODE_PROVEN
      - id: release-unmap
        nodeId: ib-umem
        title:
          zhCN: DMA unmap 与 unpin
          enUS: DMA unmap and unpin
        evidence: CODE_PROVEN
    edgeIds:
      - app-core
      - core-umem
      - umem-hook-get
      - callback-map
      - regs-bitmap
      - release-hook
  - id: gdr-peer-boundary
    title:
      zhCN: GDR / Peer Memory 证据边界
      enUS: GDR / Peer Memory Evidence Boundary
    summary:
      zhCN: peer umem 进入同一 Hook 并保存归属，但当前跳过 Host MR Bitmap。
      enUS: Peer umem enters the same hook and stores ownership, but currently skips Host MR Bitmap.
    caveat:
      zhCN: “支持 peer Hook”不等于 GPU P2P 加密端到端闭环已经证明。
      enUS: Peer-hook support does not prove an end-to-end encrypted GPU P2P path.
    steps:
      - id: peer-gpu
        nodeId: gpu-memory
        title:
          zhCN: GPU peer memory
          enUS: GPU peer memory
        evidence: CODE_PROVEN
      - id: peer-umem
        nodeId: ib-umem
        title:
          zhCN: ib_umem_get_peer
          enUS: ib_umem_get_peer
        evidence: CODE_PROVEN
      - id: peer-hook-step
        nodeId: hook-rdma
        functionId: hook-get
        title:
          zhCN: 调用 get Hook
          enUS: Invoke get hook
        evidence: CODE_PROVEN
      - id: peer-track
        nodeId: suep-rdma
        functionId: rdma-get-cb
        title:
          zhCN: 识别并保存归属
          enUS: Resolve and store ownership
        evidence: CODE_PROVEN
      - id: peer-skip-step
        nodeId: gpu-memory
        title:
          zhCN: 跳过 Host Bitmap
          enUS: Skip Host Bitmap
        evidence: CODE_PROVEN
    edgeIds:
      - gpu-umem
      - umem-hook-get
      - hook-callback
      - callback-map
      - peer-skip
  - id: safe-teardown-target
    title:
      zhCN: 安全卸载目标路径
      enUS: Safe Teardown Target Path
    summary:
      zhCN: 先阻止新回调并等待在途操作，再 drain MR、清硬件状态、删除虚拟设备，最后释放 SUEP。
      enUS: Stop new callbacks, wait for in-flight work, drain MRs and hardware state, remove virtual devices, then release SUEP.
    caveat:
      zhCN: 这是根据审计风险形成的目标顺序，当前实现尚未全部满足。
      enUS: This is the target ordering derived from the audit; current code does not yet satisfy it fully.
    steps:
      - id: stop-traffic
        nodeId: rdma-app
        title:
          zhCN: 停止新 MR/QP 流量
          enUS: Stop new MR/QP traffic
        evidence: INFERRED
      - id: unregister-hook
        nodeId: hook-rdma
        title:
          zhCN: 注销 Hook 并同步在途回调
          enUS: Unregister hook and synchronize callbacks
        evidence: INFERRED
      - id: drain-map
        nodeId: umem-route-map
        title:
          zhCN: drain 全部 MR
          enUS: Drain all MRs
        evidence: INFERRED
      - id: clear-state
        nodeId: bitmap
        title:
          zhCN: 清理 Bitmap/加密状态
          enUS: Clear Bitmap/crypto state
        evidence: INFERRED
      - id: remove-vbep
        nodeId: vbep-rnic
        title:
          zhCN: 删除 vBEP
          enUS: Remove vBEP
        evidence: INFERRED
      - id: remove-vspug
        nodeId: vspug
        title:
          zhCN: 删除 vSPUG
          enUS: Remove vSPUG
        evidence: INFERRED
      - id: remove-suep
        nodeId: suep-core
        title:
          zhCN: 释放 BAR/IRQ/NTB/SUEP
          enUS: Release BAR/IRQ/NTB/SUEP
        evidence: INFERRED
    edgeIds:
      - app-core
      - hook-callback
      - callback-map
      - regs-bitmap
      - vbep-vspug
      - suep-vpci
functions:
  - id: suep-probe
    moduleId: suep-core
    name: suep_probe
    description: 初始化 SUEP PCI 根对象及其依赖。
    evidence: CODE_PROVEN
    contract: &a1
      trigger: PCI probe
      context: SPU kernel PCI core
      consumes: pci_dev
      produces: initialized suep_dev
      stateResource: BAR/IRQ/NTB/host manager
      completionError: reverse goto rollback
    sources:
      - path: spu-g/spu_driver/suep_driver.c
        note: PCI probe entry
  - id: create-vspug
    moduleId: vspug
    name: create_virtual_spug
    description: 创建 vSPUG 并映射管理 BAR 代理窗口。
    evidence: CODE_PROVEN
    contract: &a2
      trigger: Host SPUG topology event
      context: virtual device manager
      consumes: SPUG identity and BAR metadata
      produces: suep_vspug
      stateResource: management BAR and mode
      completionError: unwind platform device and mapping
    sources:
      - path: spu-g/spu_driver/suep_virtual_device.c
        note: vSPUG lifecycle
  - id: create-vbep
    moduleId: vbep-rnic
    name: create_virtual_bep
    description: 创建并映射 RNIC vBEP。
    evidence: CODE_PROVEN
    contract: &a3
      trigger: Host BEP enters bridge mode
      context: SUEP virtual PCI bus
      consumes: BEP identity and resources
      produces: virtual pci_dev and vBEP
      stateResource: BAR/IRQ/ownership relation
      completionError: remove partially created PCI device
    sources:
      - path: spu-g/spu_driver/suep_virtual_device.c
        note: vBEP lifecycle
  - id: register-vbep
    moduleId: suep-rdma
    name: suep_rdma_register_vbep
    description: 按 RDMA 模式登记 vBEP/vSPUG 关系并注册 Hook。
    evidence: CODE_PROVEN
    contract: &a4
      trigger: RDMA vBEP creation
      context: suep RDMA companion
      consumes: vBEP and vSPUG
      produces: active RDMA device entry
      stateResource: active list and hook registration
      completionError: reject duplicate/full registration
    sources:
      - path: spu-g/spu_driver/suep_rdma_driver.c
        note: RDMA vBEP registration
  - id: umem-get
    moduleId: rdma-core
    name: ib_umem_get / ib_umem_get_peer
    description: pin 内存、DMA map，并在成功边界调用定制 Hook。
    evidence: CODE_PROVEN
    contract: &a5
      trigger: MR registration
      context: RDMA core
      consumes: VA/size/access or peer memory
      produces: DMA-mapped ib_umem
      stateResource: pinned pages and DMA SG
      completionError: unmap/unpin on failure
    sources:
      - path: spu_kernel/drivers/infiniband/core/umem.c
        note: get lifecycle
  - id: hook-get
    moduleId: hook-rdma
    name: call_suep_hook_ib_umem_get
    description: DMA map 成功后分派 SUEP get 回调。
    evidence: CODE_PROVEN
    contract: &a6
      trigger: successful ib_umem get
      context: custom kernel hook
      consumes: ib_device and ib_umem
      produces: callback side effects
      stateResource: global callback pointer
      completionError: current callback cannot propagate most hardware errors
    sources:
      - path: spu_kernel/kernel/dma/suep_hook_rdma.c
        note: get hook dispatch
  - id: rdma-get-cb
    moduleId: suep-rdma
    name: rdma_umem_get_cb
    description: 解析 ib_device → pci_dev → vBEP → vSPUG 并设置 Bitmap。
    evidence: CODE_PROVEN
    contract: &a7
      trigger: get hook callback
      context: SPU companion driver
      consumes: ib_device and DMA-mapped ib_umem
      produces: ownership entry and Bitmap update
      stateResource: active vBEP list and umem map
      completionError: current void path is not fail-closed
    sources:
      - path: spu-g/spu_driver/suep_rdma_driver.c
        note: get callback
  - id: bitmap-set
    moduleId: bitmap
    name: set_vspug_bitmap(..., true)
    description: 遍历 DMA SG，并按 4 KiB 页面设置 SPUG Bitmap。
    evidence: CODE_PROVEN
    contract: &a8
      trigger: accepted Host DRAM MR
      context: owning vSPUG
      consumes: DMA address ranges
      produces: set hardware bits
      stateResource: SPUG MR Bitmap
      completionError: bounds and MMIO errors are not fully propagated
    sources:
      - path: spu-g/spu_driver/suep_rdma_driver.c
        note: Bitmap set path
  - id: umem-release
    moduleId: rdma-core
    name: ib_umem_release
    description: 在真实 DMA unmap/unpin 前调用 release Hook。
    evidence: CODE_PROVEN
    contract: &a9
      trigger: MR deregistration
      context: RDMA core
      consumes: ib_umem
      produces: released mapping and pages
      stateResource: DMA SG lifetime
      completionError: release variants unwind their resources
    sources:
      - path: spu_kernel/drivers/infiniband/core/umem.c
        note: release lifecycle
  - id: hook-release
    moduleId: hook-rdma
    name: call_suep_hook_ib_umem_release
    description: 在 DMA SG 仍有效时分派清理回调。
    evidence: CODE_PROVEN
    contract: &a10
      trigger: ib_umem_release entry
      context: custom kernel hook
      consumes: ib_umem
      produces: callback cleanup side effects
      stateResource: global callback pointer
      completionError: unregister lacks in-flight synchronization
    sources:
      - path: spu_kernel/kernel/dma/suep_hook_rdma.c
        note: release hook dispatch
  - id: bitmap-clear
    moduleId: bitmap
    name: set_vspug_bitmap(..., false)
    description: 在 DMA unmap 前清除普通内存页 Bitmap。
    evidence: CODE_PROVEN
    contract: &a11
      trigger: release callback
      context: owning vSPUG
      consumes: saved ownership and DMA SG
      produces: cleared hardware bits
      stateResource: SPUG MR Bitmap
      completionError: overlapping MR refcount is absent
    sources:
      - path: spu-g/spu_driver/suep_rdma_driver.c
        note: Bitmap clear path
