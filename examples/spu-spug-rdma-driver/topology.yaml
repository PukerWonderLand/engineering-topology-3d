    lane: LIFECYCLE
  - id: hook-callback
    source: hook-rdma
    target: suep-rdma
    title:
      zhCN: 回调分派
      enUS: Callback dispatch
    description:
      zhCN: 调用 SUEP 注册的 get/release 回调。
      enUS: Invokes SUEP-registered get/release callbacks.
    kind: control
    evidence: CODE_PROVEN
    color: "#d85068"
    lane: CONTROL
  - id: callback-map
    source: suep-rdma
    target: umem-route-map
    title:
      zhCN: 保存/查询归属
      enUS: Store/lookup ownership
    description:
      zhCN: ib_umem 指针关联 vBEP 索引。
      enUS: Associates ib_umem pointers with vBEP indices.
    kind: lifecycle
    evidence: CODE_PROVEN
    color: "#d75b69"
    lane: LIFECYCLE
  - id: callback-vbep
    source: suep-rdma
    target: vbep-rnic
    title:
      zhCN: 定位 RNIC
      enUS: Resolve RNIC
    description:
      zhCN: pci_dev → vBEP。
      enUS: pci_dev → vBEP.
    kind: control
    evidence: CODE_PROVEN
    color: "#2f83e7"
    lane: OWNERSHIP
  - id: vbep-vspug
    source: vbep-rnic
    target: vspug
    title:
      zhCN: 所属 SPUG
      enUS: Owning SPUG
    description:
      zhCN: vBEP → vSPUG 稳定归属关系。
      enUS: Stable vBEP → vSPUG ownership relation.
    kind: lifecycle
    evidence: CODE_PROVEN
    color: "#2f83e7"
    lane: OWNERSHIP
  - id: suep-vpci
    source: suep-core
    target: virtual-pci
    title:
      zhCN: 初始化总线
      enUS: Initialize bus
    description:
      zhCN: SUEP 建立虚拟 PCI 总线。
      enUS: SUEP establishes the virtual PCI bus.
    kind: lifecycle
    evidence: CODE_PROVEN
    color: "#2878c7"
    lane: VIRTUALIZATION
  - id: vpci-vspug
    source: virtual-pci
    target: vspug
    title:
      zhCN: 创建 vSPUG
      enUS: Create vSPUG
    description:
      zhCN: 映射管理窗口并读取工作模式。
      enUS: Maps management window and reads work mode.
    kind: lifecycle
    evidence: CODE_PROVEN
    color: "#3479c9"
    lane: VIRTUALIZATION
  - id: vpci-vbep
    source: virtual-pci
    target: vbep-rnic
    title:
      zhCN: 创建/激活 vBEP
      enUS: Create/activate vBEP
    description:
      zhCN: 扫描设备、映射 BAR 并加入 PCI core。
      enUS: Scans the device, maps BARs, and adds it to PCI core.
    kind: lifecycle
    evidence: CODE_PROVEN
    color: "#3d8bd9"
    lane: VIRTUALIZATION
  - id: vspug-register
    source: vspug
    target: suep-rdma
    title:
      zhCN: RDMA 模式装配
      enUS: RDMA-mode attach
    description:
      zhCN: mode=RDMA 时注册 vBEP 扩展。
      enUS: Registers the vBEP extension when mode=RDMA.
    kind: lifecycle
    evidence: CODE_PROVEN
    color: "#c13f5c"
    lane: VIRTUALIZATION
  - id: callback-regs
    source: suep-rdma
    target: hardware-regs
    title:
      zhCN: Bitmap/加密操作
      enUS: Bitmap/crypto operations
    description:
      zhCN: 业务层通过寄存器抽象访问 SPUG。
      enUS: Business logic accesses SPUG through the register abstraction.
    kind: control
    evidence: CODE_PROVEN
    color: "#168f7b"
    lane: MMIO
  - id: manager-regs
    source: region-manager
    target: hardware-regs
    title:
      zhCN: 唯一硬件 owner
      enUS: Single hardware owner
    description:
      zhCN: 目标架构中统一执行引用和批量 MMIO。
      enUS: Target design centralizes references and batched MMIO.
    kind: control
    evidence: INFERRED
    color: "#13a681"
    lane: TARGET
    dashed: true
  - id: regs-bitmap
    source: hardware-regs
    target: bitmap
    title:
      zhCN: MMIO 置位/清位
      enUS: MMIO set/clear
    description:
      zhCN: 按 DMA 页更新硬件 Bitmap。
      enUS: Updates hardware Bitmap by DMA page.
    kind: physical
    evidence: CODE_PROVEN
    color: "#1ba98b"
    lane: MMIO
  - id: bitmap-fpga
    source: bitmap
    target: spug-fpga
    title:
      zhCN: 页面分类策略
      enUS: Page classification policy
    description:
      zhCN: Bitmap 状态参与 Payload 分类。
      enUS: Bitmap state participates in payload classification.
    kind: control
    evidence: RTL_PROVEN
    color: "#36b79c"
    lane: HARDWARE
