        - id: rdma-userspace
          label: RDMA 用户态
          hint: 应用、libibverbs 与 MR 操作
        - id: linux-rdma-core
          label: SPU Linux RDMA 内核
          hint: RDMA core、ib_umem、irdma 与最终 DMA SG
        - id: kernel-hook-driver
          label: 定制内核 Hook 与伴随驱动
          hint: get/release 回调、设备归属与历史映射
        - id: suep-virtualization
          label: SUEP 虚拟化层
          hint: SUEP、虚拟 PCI 总线、vSPUG 与 RNIC vBEP
