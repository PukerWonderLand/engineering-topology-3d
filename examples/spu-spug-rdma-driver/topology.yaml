schemaVersion: "2.0"
id: spu-spug-rdma-driver
title:
  zhCN: SPU / SPUG RDMA 驱动、内核与虚拟化架构
  enUS: SPU / SPUG RDMA Driver, Kernel, and Virtualization
description:
  zhCN: 展示 RDMA MR、定制内核 Hook、SUEP 虚拟设备、SPUG Bitmap 与 RNIC 数据面的关系及完整生命周期。
  enUS: Maps RDMA MR lifecycle, custom kernel hooks, SUEP virtual devices, SPUG Bitmap, and the RNIC data plane.
evidence: CODE_PROVEN
locales:
  default: zh-CN
  supported:
    - zh-CN
    - en-US
zones:
  - id: rdma-userspace
    title: &a50
      zhCN: RDMA 用户态
      enUS: RDMA Userspace
    eyebrow: &a49
      zhCN: 区域 01 · 请求入口
      enUS: ZONE 01 · REQUEST ENTRY
    summary: &a51
      zhCN: 应用、libibverbs 与 MR 操作
      enUS: Application, libibverbs, and MR operations
    color: "#22a7cf"
    nodeIds: &a19
      - rdma-app
  - id: linux-rdma-core
    title: &a54
      zhCN: SPU Linux RDMA 内核
      enUS: SPU Linux RDMA Kernel
    eyebrow: &a53
      zhCN: 区域 02 · DMA 地址事实源
      enUS: ZONE 02 · DMA ADDRESS AUTHORITY
    summary: &a55
      zhCN: RDMA core、ib_umem、irdma 与最终 DMA SG
      enUS: RDMA core, ib_umem, irdma, and final DMA SG
    color: "#7657c8"
    nodeIds: &a20
      - rdma-core
      - ib-umem
      - irdma
  - id: kernel-hook-driver
    title: &a58
      zhCN: 定制内核 Hook 与伴随驱动
      enUS: Custom Kernel Hook and Companion Driver
    eyebrow: &a57
      zhCN: 区域 03 · MR 生命周期桥
      enUS: ZONE 03 · MR LIFECYCLE BRIDGE
    summary: &a59
      zhCN: get/release 回调、设备归属与历史映射
      enUS: Get/release callbacks, device ownership, and legacy mapping
    color: "#e14b72"
    nodeIds: &a21
      - hook-rdma
      - suep-rdma
      - umem-route-map
  - id: suep-virtualization
    title: &a62
      zhCN: SUEP 虚拟化层
      enUS: SUEP Virtualization Layer
    eyebrow: &a61
      zhCN: 区域 04 · 设备归属事实源
      enUS: ZONE 04 · DEVICE OWNERSHIP AUTHORITY
    summary: &a63
      zhCN: SUEP、虚拟 PCI 总线、vSPUG 与 RNIC vBEP
      enUS: SUEP, virtual PCI bus, vSPUG, and RNIC vBEP
    color: "#2f83e7"
    nodeIds: &a22
      - suep-core
      - virtual-pci
      - vspug
      - vbep-rnic
  - id: spug-security
    title: &a66
      zhCN: SPUG 资源与密码数据面
      enUS: SPUG Resource and Crypto Data Plane
    eyebrow: &a65
      zhCN: 区域 05 · 硬件状态事实源
      enUS: ZONE 05 · HARDWARE STATE AUTHORITY
    summary: &a67
      zhCN: MMIO、Bitmap、加密使能与统一资源管理方向
      enUS: MMIO, Bitmap, crypto enable, and unified resource ownership
    color: "#168f7b"
    nodeIds: &a23
      - hardware-regs
      - region-manager
      - bitmap
      - spug-fpga
  - id: memory-and-device
    title: &a70
      zhCN: 内存与物理设备
      enUS: Memory and Physical Devices
    eyebrow: &a69
      zhCN: 区域 06 · PCIe 数据端点
      enUS: ZONE 06 · PCIE DATA ENDPOINTS
    summary: &a71
      zhCN: Host DRAM、GPU peer memory 与物理 RNIC
      enUS: Host DRAM, GPU peer memory, and physical RNIC
    color: "#7fae3f"
    nodeIds: &a24
      - host-memory
      - gpu-memory
      - physical-rnic
nodes:
  - id: rdma-app
    zoneId: rdma-userspace
    title: &a73
      zhCN: RDMA 应用 / libibverbs
      enUS: RDMA Application / libibverbs
    description:
      zhCN: 注册或释放 MR，并发起 RDMA Read、Write 或 Atomic。
      enUS: Registers or releases MRs and issues RDMA Read, Write, or Atomic operations.
    kind: application
    evidence: CODE_PROVEN
    color: "#22a7cf"
    interfaces: &a12
      - ibv_reg_mr
      - ibv_dereg_mr
  - id: rdma-core
    zoneId: linux-rdma-core
    title: &a75
      zhCN: RDMA Core
      enUS: RDMA Core
    description:
      zhCN: 处理 MR 语义、页锁定以及 ib_umem 生命周期。
      enUS: Owns MR semantics, page pinning, and the ib_umem lifecycle.
    kind: driver
    evidence: CODE_PROVEN
    color: "#7657c8"
    sources:
      - path: spu_kernel/drivers/infiniband/core/umem.c
        note: RDMA umem lifecycle boundary
  - id: ib-umem
    zoneId: linux-rdma-core
    title: &a77
      zhCN: ib_umem + DMA SG
      enUS: ib_umem + DMA SG
    description:
      zhCN: 在 ib_dma_map_sg 后保存设备最终可见的 dma_addr_t 与长度。
      enUS: Carries device-visible dma_addr_t ranges after ib_dma_map_sg.
    kind: buffer
    evidence: CODE_PROVEN
    color: "#8a61d1"
    tags: &a13
      - DMA_MAPPED
      - address-authority
  - id: irdma
    zoneId: linux-rdma-core
    title: &a79
      zhCN: ice + irdma
      enUS: ice + irdma
    description:
      zhCN: Intel E810 RoCE 驱动栈；当前定制逻辑不侵入其 WQE 数据面。
      enUS: Intel E810 RoCE stack; custom logic does not modify its WQE data path.
    kind: driver
    evidence: CODE_PROVEN
    color: "#6750b5"
  - id: hook-rdma
    zoneId: kernel-hook-driver
    title: &a81
      zhCN: spu_kernel hook_rdma
      enUS: spu_kernel hook_rdma
    description:
      zhCN: 在 ib_umem get 成功后和真正 release/unmap 前调用 SUEP 回调。
      enUS: Invokes SUEP callbacks after successful get and before the actual release/unmap.
    kind: protocol
    evidence: CODE_PROVEN
    color: "#e14b72"
    sources:
      - path: spu_kernel/include/linux/suep_hook_rdma.h
        note: Hook API
      - path: spu_kernel/kernel/dma/suep_hook_rdma.c
        note: Hook registration and dispatch
  - id: suep-rdma
    zoneId: kernel-hook-driver
    title: &a83
      zhCN: suep_rdma_driver
      enUS: suep_rdma_driver
    description:
      zhCN: 识别 RNIC vBEP 与所属 vSPUG，并把 Host DRAM DMA 页映射到 Bitmap。
      enUS: Resolves the RNIC vBEP and owning vSPUG, then maps Host DRAM DMA pages into Bitmap.
    kind: driver
    evidence: CODE_PROVEN
    color: "#c13f5c"
    sources:
      - path: spu-g/spu_driver/suep_rdma_driver.c
        note: RDMA callback and Bitmap lifecycle
  - id: umem-route-map
    zoneId: kernel-hook-driver
    title: &a85
      zhCN: ib_umem → vBEP 映射表
      enUS: ib_umem → vBEP Map
    description:
      zhCN: release 时恢复设备归属；当前实现存在条目未删除、裸指针和并发风险。
      enUS: Restores ownership during release; current code has stale-entry, raw-pointer, and concurrency risks.
    kind: state
    evidence: CODE_PROVEN
    color: "#d75b69"
    tags: &a14
      - P0-risk
      - lifecycle-gap
  - id: suep-core
    zoneId: suep-virtualization
    title: &a87
      zhCN: SUEP PCI 根驱动
      enUS: SUEP PCI Root Driver
    description:
      zhCN: probe 时建立 BAR、NTB、IRQ、Host 管理、sysfs 和 RDMA 子模块。
      enUS: Probe establishes BAR, NTB, IRQ, host management, sysfs, and the RDMA submodule.
    kind: driver
    evidence: CODE_PROVEN
    color: "#2878c7"
    sources:
      - path: spu-g/spu_driver/suep_driver.c
        note: SUEP probe and remove root
  - id: virtual-pci
    zoneId: suep-virtualization
    title: &a89
      zhCN: SUEP 虚拟 PCI 总线
      enUS: SUEP Virtual PCI Bus
    description:
      zhCN: 将 SPUG 后物理 PCIe 设备以标准 PCI 设备形态呈现给 SPU OS。
      enUS: Presents physical PCIe devices behind SPUG as standard PCI devices to the SPU OS.
    kind: protocol
    evidence: CODE_PROVEN
    color: "#2f83e7"
  - id: vspug
    zoneId: suep-virtualization
    title: &a91
      zhCN: vSPUG 管理对象
      enUS: vSPUG Management Object
    description:
      zhCN: 保存工作模式、BAR 代理窗口、RDMA window 与 SPUG 生命周期。
      enUS: Owns work mode, BAR proxy window, RDMA window, and SPUG lifetime.
    kind: device
    evidence: CODE_PROVEN
    color: "#3479c9"
    interfaces: &a15
      - NORMAL
      - RDMA
      - NVME
  - id: vbep-rnic
    zoneId: suep-virtualization
    title: &a93
      zhCN: RNIC vBEP
      enUS: RNIC vBEP
    description:
      zhCN: SPUG 后 RNIC 在虚拟 PCI 总线中的设备对象，是 RDMA 回调定位入口。
      enUS: Virtual PCI representation of the RNIC behind SPUG and the ownership lookup entry.
    kind: device
    evidence: CODE_PROVEN
    color: "#3d8bd9"
  - id: hardware-regs
    zoneId: spug-security
    title: &a95
      zhCN: SPUG 硬件寄存器层
      enUS: SPUG Hardware Register Layer
    description:
      zhCN: 集中封装 Bitmap、window、密钥与加密使能的 MMIO ABI。
      enUS: Centralizes the MMIO ABI for Bitmap, window, keys, and crypto enable.
    kind: driver
    evidence: CODE_PROVEN
    color: "#168f7b"
    sources:
      - path: spu-g/spu_driver/suep_vspug_hardware_regs.c
        note: SPUG MMIO abstraction
  - id: region-manager
    zoneId: spug-security
    title: &a97
      zhCN: 统一 DMA Region Manager（目标）
      enUS: Unified DMA Region Manager (Target)
    description:
      zhCN: 建议成为 RDMA/NVMe 的唯一 Bitmap owner，负责引用计数、generation、批量 MMIO 与 fail-closed。
      enUS: Proposed single Bitmap owner for RDMA/NVMe with refcounts, generations, batched MMIO, and fail-closed behavior.
    kind: service
    evidence: INFERRED
    color: "#13a681"
    tags: &a16
      - target-architecture
      - single-owner
  - id: bitmap
    zoneId: spug-security
    title: &a99
      zhCN: SPUG MR Bitmap
      enUS: SPUG MR Bitmap
    description:
      zhCN: 以 4 KiB 粒度分类 Host 普通内存 DMA 页；其地址域必须与 FPGA 观察点一致。
      enUS: Classifies ordinary Host-memory DMA pages at 4 KiB granularity; its address domain must match the FPGA observation point.
    kind: state
    evidence: CODE_PROVEN
    color: "#1ba98b"
    tags: &a17
      - 4KiB
      - MMIO
      - refcount-required
  - id: spug-fpga
    zoneId: spug-security
    title: &a101
      zhCN: SPUG FPGA 密码数据面
      enUS: SPUG FPGA Crypto Data Plane
    description:
      zhCN: 依据硬件表和策略识别 PCIe Payload 并执行加解密；端到端效果仍需板测证明。
      enUS: Uses hardware tables and policy to classify and transform PCIe payload; end-to-end behavior still requires board validation.
    kind: hardware
    evidence: RTL_PROVEN
    color: "#36b79c"
  - id: host-memory
    zoneId: memory-and-device
    title: &a103
      zhCN: Host / SPU DRAM
      enUS: Host / SPU DRAM
    description:
      zhCN: 普通 ib_umem 的页来源；DMA SG 会进入 MR Bitmap。
      enUS: Page source for ordinary ib_umem; mapped DMA SG enters the MR Bitmap.
    kind: hardware
    evidence: CODE_PROVEN
    color: "#7fae3f"
  - id: gpu-memory
    zoneId: memory-and-device
    title: &a105
      zhCN: GPU Peer Memory / GDR
      enUS: GPU Peer Memory / GDR
    description:
      zhCN: is_peer 路径会被跟踪但跳过 Host MR Bitmap；P2P 加密闭环尚未由当前代码证明。
      enUS: The is_peer path is tracked but skips Host MR Bitmap; the P2P crypto loop is not yet proven by current code.
    kind: hardware
    evidence: INFERRED
    color: "#9dbd5d"
    tags: &a18
      - GDR
      - unresolved-boundary
  - id: physical-rnic
    zoneId: memory-and-device
    title: &a107
      zhCN: 物理 RNIC / Intel E810
      enUS: Physical RNIC / Intel E810
    description:
      zhCN: 发起和接收 RoCE PCIe 数据事务的物理端点。
      enUS: Physical endpoint issuing and receiving RoCE PCIe transactions.
    kind: device
    evidence: CODE_PROVEN
    color: "#6f9f3d"
edges:
